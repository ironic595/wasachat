<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WasaChat - Dashboard</title>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f5f5; }
    .container { max-width: 900px; margin: 50px auto; padding: 20px; }
    .card { background: white; padding: 30px; border-radius: 8px; margin: 20px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; }
    h2 { color: #4285f4; border-bottom: 2px solid #4285f4; padding-bottom: 10px; }
    button { background: #4285f4; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 16px; margin: 5px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    button.danger { background: #dc3545; }
    button.success { background: #28a745; }
    button.warning { background: #ff9500; }
    button.big { width: 100%; padding: 20px; font-size: 18px; margin: 10px 0; }
    input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
    .hidden { display: none!important; }
    #userInfo { text-align: center; padding: 15px; background: #e9ecef; border-radius: 8px; margin-bottom: 20px; }
    .info-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .info-row:last-child { border-bottom: none; }
    .estado-activo { color: #28a745; font-weight: bold; }
    .estado-inactivo { color: #dc3545; font-weight: bold; }
    #debug { background: #fff3cd; padding: 12px; border-radius: 4px; margin: 20px 0; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>WasaChat - Panel de Control</h1>
    <div id="userInfo"></div>
    <div id="debug">Cargando datos del Worker...</div>

    <div class="card" id="stepDominio">
      <h2>1. Registrá tu dominio</h2>
      <p>El chat solo va a funcionar en este dominio. Podés cambiarlo después.</p>
      <input type="text" id="dominioInput" placeholder="Ej: negocio.com">
      <button id="guardarDominioBtn" class="success">Guardar dominio</button>
    </div>

    <div class="card hidden" id="panelPrincipal">
      <h2>✅ Todo configurado</h2>
      <div class="info-row">
        <div><strong>Dominio:</strong> <span id="dominioActual"></span></div>
        <button class="warning" onclick="mostrarCambiarDominio()">Cambiar dominio</button>
      </div>
      <div class="info-row">
        <div><strong>Estado del Bot:</strong> <span id="estadoBot"></span></div>
        <button id="btnComprarPlan" class="danger hidden" onclick="irAComprar()">Comprar Plan para Activar</button>
      </div>
      <div class="card" style="margin-top:30px;">
        <h3>🎨 Configuración del Widget</h3>
        <textarea id="codigoWidget" readonly rows="3" style="font-size:12px; font-family:monospace; width:100%; padding:12px;"></textarea>
        <button onclick="copiarCodigo()" style="width:100%; margin-top:8px;">📋 Copiar código</button>
      </div>
    </div>

    <button id="logoutBtn" class="danger" style="width:100%;margin-top:20px;">Cerrar sesión</button>
  </div>

  <div id="modal-cambiar-dominio" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:300;">
    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:30px; border-radius:8px; text-align:center; min-width:300px;">
      <h3>Cambiar dominio</h3>
      <input type="text" id="nuevoDominioInput" placeholder="Ej: negocio.com" style="width:100%; padding:12px; margin:10px 0;">
      <button onclick="cambiarDominio()" class="success" style="margin:10px;">Guardar</button>
      <button onclick="cerrarModales()" style="background:#6c757d; color:white; padding:10px 20px; border:none; cursor:pointer;">Cancelar</button>
    </div>
  </div>

<script>
    const botId = localStorage.getItem('bot_id');
    const userEmail = localStorage.getItem('user_email');

    if (!botId || !userEmail) {
      window.location.href = 'index.html';
    }

    document.getElementById('userInfo').innerHTML = `<strong>${userEmail}</strong>`;
    let userData = null;

    async function cargarBot() {
  try {
    const res = await fetch('https://api.wasa.chat/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bot_id: botId })
    });
    const data = await res.json();
    
    document.getElementById('debug').innerHTML = `<strong>Respuesta del Worker:</strong><br>${JSON.stringify(data, null, 2)}`;
    console.log('[DEBUG] Worker response:', data);
    
    // Si hay error de "Bot no encontrado", cortá
    if (data.error === 'Bot no encontrado') {
      alert('Error: Bot no encontrado');
      return;
    }
    
    userData = {
      email: userEmail,
      bot_id: botId,
      estado: data.estado,
      domain: data.domain,
      config: data.config,
      data: data.data
    };
    mostrarPanelCorrecto();
    cargarConfigWidget();
  } catch(e) {
    document.getElementById('debug').innerHTML = `<strong>ERROR:</strong> ${e.message}`;
    console.error('Error:', e);
  }
}

  function mostrarPanelCorrecto() {
  const stepDominio = document.getElementById('stepDominio');
  const panelPrincipal = document.getElementById('panelPrincipal');

  console.log('[DEBUG] userData.domain:', userData.domain);

  if (!userData.domain || userData.domain === null || userData.domain === '') {
    stepDominio.classList.remove('hidden');
    panelPrincipal.classList.add('hidden');
  } else {
    stepDominio.classList.add('hidden');
    panelPrincipal.classList.remove('hidden');
    document.getElementById('dominioActual').textContent = userData.domain;

    const estadoBotSpan = document.getElementById('estadoBot');
    const btnComprar = document.getElementById('btnComprarPlan');

    if (userData.estado === 'activo' || userData.estado === 'pago') {
      estadoBotSpan.textContent = '✅ Activo';
      estadoBotSpan.className = 'estado-activo';
      btnComprar.classList.add('hidden');
    } else {
      estadoBotSpan.textContent = '⚠ Inactivo - Requiere suscripción';
      estadoBotSpan.className = 'estado-inactivo';
      btnComprar.classList.remove('hidden');
    }
  }
}
   
    function irAComprar() {
      window.location.href = 'index.html#precios';
    }

    document.getElementById('guardarDominioBtn').addEventListener('click', async () => {
      let dominio = document.getElementById('dominioInput').value.trim();
      dominio = dominio.replace(/https?:\/\//, '').replace(/\/$/, '').replace(/www\./, '');
      if (!dominio) return alert("Ingresá un dominio válido");

      try {
        const res = await fetch('https://api.wasa.chat/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bot_id: userData.bot_id, domain: dominio })
        });
        const result = await res.json();
        console.log('[DEBUG] Guardar dominio response:', result);
        
        userData.domain = dominio;
        alert('Dominio guardado. Recargando...');
        location.reload();
      } catch (e) {
        alert('Error: ' + e.message);
      }
    });

    function mostrarCambiarDominio() {
      document.getElementById('nuevoDominioInput').value = userData.domain;
      document.getElementById('modal-cambiar-dominio').style.display = 'block';
    }

    async function cambiarDominio() {
      let nuevo = document.getElementById('nuevoDominioInput').value.trim();
      nuevo = nuevo.replace(/https?:\/\//, '').replace(/\/$/, '').replace(/www\./, '');
      if (!nuevo) return alert("Ingresá un dominio");

      try {
        await fetch('https://api.wasa.chat/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bot_id: userData.bot_id, domain: nuevo })
        });
        userData.domain = nuevo;
        document.getElementById('dominioActual').textContent = nuevo;
        cerrarModales();
        generarCodigoWidget();
        alert('✅ Dominio actualizado');
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }

    function cargarConfigWidget() {
      generarCodigoWidget();
    }

    function generarCodigoWidget() {
      const botIdFinal = userData.bot_id || 'wasa_' + currentUser.email.replace(/[^a-z0-9]/gi, '');
      const codigo = `<script src="https://api.wasa.chat/widget.js" data-bot-id="${botIdFinal}"><\/script>`;
      document.getElementById('codigoWidget').value = codigo;
    }

    function copiarCodigo() {
      const textarea = document.getElementById('codigoWidget');
      textarea.select();
      document.execCommand('copy');
      alert('📋 Código copiado');
    }

    function cerrarModales() {
      document.querySelectorAll('.modal-fondo, [id^="modal-"]').forEach(m => m.style.display = 'none');
    }

    function logout() {
      localStorage.removeItem('bot_id');
      localStorage.removeItem('user_email');
      window.location.href = 'index.html';
    }

    document.getElementById('logoutBtn').addEventListener('click', logout);
    cargarBot();
</script>
</body></html>
