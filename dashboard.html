<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MiBot IA - Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
    .card { background: #f5f5f5; padding: 20px; border-radius: 8px; margin: 20px 0; }
    button { background: #4285f4; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    input { padding: 10px; width: 300px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
    .success { color: green; }
    .error { color: red; }
    #status { margin: 15px 0; }
  </style>
</head>
<body>
  <h1>MiBot IA - Dashboard</h1>
  <div id="userInfo"></div>
  
  <div class="card" id="whatsappCard" style="display:none;">
    <h3>1. Conectá tu WhatsApp</h3>
    <input type="text" id="whatsappInput" placeholder="Ej: 5491123456789">
    <button id="guardarWsBtn">Guardar número</button>
    <div id="status"></div>
  </div>

  <div class="card" id="sheetCard" style="display:none;">
    <h3>2. Creá tu base de datos</h3>
    <p>Vamos a crear un Google Sheet en tu Drive para gestionar productos y pedidos.</p>
    <button id="crearSheetBtn">Crear mi Google Sheet</button>
    <div id="sheetStatus"></div>
  </div>

  <div class="card" id="listoCard" style="display:none;">
    <h3 class="success">✅ Todo listo</h3>
    <p>WhatsApp: <span id="wsFinal"></span></p>
    <p>Google Sheet: <a id="sheetLink" target="_blank">Abrir mi Sheet</a></p>
    <p>Ya podés cargar productos en la pestaña "productos" y tu bot va a responder automático.</p>
  </div>

  <button id="logoutBtn" style="background:#db4437;">Cerrar sesión</button>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAsijWNnO1s2dJz9f8wqQJwJ",
      authDomain: "dbwasa-f07b6.firebaseapp.com",
      projectId: "dbwasa-f07b6",
      storageBucket: "dbwasa-f07b6.appspot.com",
      messagingSenderId: "594633226854",
      appId: "1:594633226854:web:aa2a54a5d3"
    };
    
    const CLIENT_ID = '849916257157-o3f2cj1eampdldhap1hjv7u1aeiq559e.apps.googleusercontent.com'; // Reemplazar con tu Client ID completo
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    let currentUser = null;
    let userData = null;
    let tokenClient;
    let gapi_inited = false;

    // Inicializar Google API
    gapi.load('client', async () => {
      await gapi.client.init({});
      gapi_inited = true;
    });

    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: '', // Se define dinámicamente
    });

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      
      currentUser = user;
      document.getElementById('userInfo').innerHTML = `<p>Hola, ${user.displayName} | ${user.email}</p>`;
      
      const doc = await db.collection('users').doc(user.email).get();
      userData = doc.data();
      
      if (!userData.whatsapp) {
        document.getElementById('whatsappCard').style.display = 'block';
      } else if (!userData.sheet_id) {
        document.getElementById('whatsappCard').style.display = 'none';
        document.getElementById('sheetCard').style.display = 'block';
      } else {
        mostrarListo();
      }
    });

    document.getElementById('guardarWsBtn').addEventListener('click', async () => {
      const whatsapp = document.getElementById('whatsappInput').value.trim();
      if (!whatsapp) return;
      
      await db.collection('users').doc(currentUser.email).update({ whatsapp });
      document.getElementById('whatsappCard').style.display = 'none';
      document.getElementById('sheetCard').style.display = 'block';
    });

    document.getElementById('crearSheetBtn').addEventListener('click', () => {
      tokenClient.callback = async (resp) => {
        if (resp.error) {
          document.getElementById('sheetStatus').innerHTML = '<p class="error">Error: ' + resp.error + '</p>';
          return;
        }
        await crearSheet(resp.access_token);
      };
      
      tokenClient.requestAccessToken({prompt: 'consent'});
    });

    async function crearSheet(accessToken) {
      const btn = document.getElementById('crearSheetBtn');
      btn.disabled = true;
      btn.textContent = 'Creando en tu Drive...';
      
      try {
        // 1. Crear Sheet vacío con Drive API
        const metadata = {
          name: `MiBot IA - ${userData.nombre}`,
          mimeType: 'application/vnd.google-apps.spreadsheet'
        };
        
        const driveRes = await fetch('https://www.googleapis.com/drive/v3/files', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(metadata)
        });
        
        const file = await driveRes.json();
        const sheetId = file.id;
        
        // 2. Agregar pestañas y datos con Sheets API
        const requests = [
          { addSheet: { properties: { title: 'productos' } } },
          { addSheet: { properties: { title: 'config' } } },
          { addSheet: { properties: { title: 'pedidos' } } },
          { deleteSheet: { sheetId: 0 } } // Borrar Hoja1
        ];
        
        await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}:batchUpdate`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ requests })
        });
        
        // 3. Cargar datos iniciales
        const values = {
          'productos!A1:F2': [
            ['sku', 'nombre', 'precio', 'stock', 'descripcion', 'foto_url'],
            ['SKU001', 'Producto ejemplo', 1500, 10, 'Cambiá esto por tus productos', '']
          ],
          'config!A1:B4': [
            ['clave', 'valor'],
            ['nombre_negocio', userData.nombre],
            ['moneda', 'ARS'],
            ['mensaje_bienvenida', 'Hola! Soy el bot de ' + userData.nombre]
          ],
          'pedidos!A1:F1': [
            ['fecha', 'cliente_numero', 'cliente_nombre', 'productos', 'total', 'estado']
          ]
        };
        
        await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values:batchUpdate`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            valueInputOption: 'RAW',
            data: Object.entries(values).map(([range, vals]) => ({ range, values: vals }))
          })
        });
        
        // 4. Guardar en Firestore
        await db.collection('users').doc(currentUser.email).update({
          sheet_id: sheetId,
          sheet_url: `https://docs.google.com/spreadsheets/d/${sheetId}`
        });
        
        document.getElementById('sheetStatus').innerHTML = '<p class="success">¡Sheet creado en tu Drive!</p>';
        setTimeout(() => location.reload(), 1500);
        
      } catch (error) {
        document.getElementById('sheetStatus').innerHTML = '<p class="error">Error: ' + error.message + '</p>';
        btn.disabled = false;
        btn.textContent = 'Crear mi Google Sheet';
      }
    }

    function mostrarListo() {
      document.getElementById('whatsappCard').style.display = 'none';
      document.getElementById('sheetCard').style.display = 'none';
      document.getElementById('listoCard').style.display = 'block';
      document.getElementById('wsFinal').textContent = userData.whatsapp;
      document.getElementById('sheetLink').href = userData.sheet_url;
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      auth.signOut();
    });
  </script>
</body>
</html>
