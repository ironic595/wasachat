<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wasa.chat - 100 Niveles - FINAL COMPLETO</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="text/javascript">
   window._gm_isAdPlaying = false;
   window._gm_sdk_ready = false;
   window._gm_adShown = false;
   window._gm_hasAd = false;
   
   window.SDK_OPTIONS = {
      gameId: "4kci7og3klgj0ivy2wz3gdvd9dth5e7n",
      onEvent: function (a) {

         if(a.name==='SDK_GAME_PAUSE'){

         }

           window._gm_isAdPlaying = false;

           window._gm_hasAd = false;

         if(a.name==='SDK_READY') window._gm_sdk_ready = true;
         if(a.name==='SDK_NO_AD' || (a.name==='SDK_ERROR' && a.message && a.message.toLowerCase().includes('no ad'))){
           window._gm_hasAd = false;
         }
      }
   };
   (function (a, b, c) {
      var d = a.getElementsByTagName(b)[0];
      a.getElementById(c) || (a = a.createElement(b), a.id = c, a.src = "https://api.gamemonetize.com/sdk.js", d.parentNode.insertBefore(a, d))
   })(document, "script", "gamemonetize-sdk");
</script>

<style>
body{margin:0;background:#21418f;overflow:hidden;font-family:Inter,system-ui,sans-serif}
canvas{display:block}
@keyframes load{0%{width:0%}100%{width:100%}}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 #000}50%{box-shadow:0 6px 0 #000,0 0 0 12px rgba(255,222,89,0)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui" class="absolute inset-0 pointer-events-none font-sans"></div>
<script>
// === WASA.CHAT - 100 NIVELES + 10 NAVES + CHECKPOINTS (BASE ORIGINAL INTACTA) ===
let W=innerWidth,H=innerHeight;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
function resize(){W=innerWidth;H=innerHeight;const dpr=devicePixelRatio||1;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
resize(); addEventListener('resize',resize);

let ups=JSON.parse(localStorage.getItem('wasa_upgrades_final')||'{"d":{"main":0,"sub":0},"c":{"main":0,"sub":0},"p":{"main":0,"sub":0}}');
let coins=parseInt(localStorage.getItem('wasa_coins_final')||'0');
let ranking=JSON.parse(localStorage.getItem('wasa_ranking_final')||'[]');
let maxLevel=parseInt(localStorage.getItem('wasa_max_level')||'1');

let game={ships:[],cross:{x:W/2,y:H*0.62,dir:1,speed:420},power:{v:0,dir:1,speed:82,state:'moving',locked:50},bullets:[],parts:[],stars:[],level:1,points:0,misses:0,levelStart:0};
let state='menu';
let ad={type:null,timer:5,unlocked:false};
let adUses=0, tempCoins=0, tempPoints=0, last=performance.now();
let levelUpInfo={level:2,points:0};
let pauseBeforeState=null;

for(let i=0;i<140;i++) game.stars.push({x:Math.random()*W,y:Math.random()*H*0.85,size:Math.random()*1.8+0.3,tw:Math.random()*2+0.5,off:Math.random()*6});

function getShipConfig(level){
  const tier = Math.min(Math.floor((level-1)/10),9);
  const configs = [
    {name:'SCOUT', colors:{body:'#cfe0ff', belly:'#5a7bd6', cockpit:['#ffffff','#9ef0ff','#3a6bff'], lights:['#ffde59','#ff6b6b']}, w:78, h:26, hp:20, speed:90, behavior:'normal'},
    {name:'RAIDER ROJO', colors:{body:'#ffcfe0', belly:'#d65a7b', cockpit:['#ffffff','#ff9eb0','#ff3a5a'], lights:['#ffde59','#ff4444']}, w:82, h:28, hp:28, speed:110, behavior:'normal'},
    {name:'DUO', colors:{body:'#cfe0ff', belly:'#5a7bd6', cockpit:['#ffffff','#9ef0ff','#3a6bff'], lights:['#ffde59','#ff6b6b']}, w:78, h:26, hp:22, speed:100, behavior:'duo', count:2},
    {name:'ACORAZADO', colors:{body:'#e0cfff', belly:'#7b5ad6', cockpit:['#ffffff','#c99eff','#7b3aff'], lights:['#a0ff59','#ff6bff']}, w:120, h:34, hp:45, speed:70, behavior:'zigzag'},
    {name:'FANTASMA', colors:{body:'#cffff0', belly:'#5ad6b0', cockpit:['#ffffff','#9effdd','#3affaa'], lights:['#59ffde','#6bff8a']}, w:75, h:24, hp:30, speed:130, behavior:'ghost'},
    {name:'ZIGZAG', colors:{body:'#ffefcf', belly:'#d6a05a', cockpit:['#ffffff','#ffe09e','#ffaa3a'], lights:['#ffde59','#ff8a2a']}, w:80, h:26, hp:35, speed:95, behavior:'zigzag_fast'},
    {name:'AVISPA', colors:{body:'#d0ffc0', belly:'#6bd65a', cockpit:['#ffffff','#b0ff9e','#5aff3a'], lights:['#ffde59','#a0ff00']}, w:48, h:18, hp:18, speed:180, behavior:'tiny_fast', count:2},
    {name:'BOMBER', colors:{body:'#ffcfa0', belly:'#d67b5a', cockpit:['#ffffff','#ffc99e','#ff7b3a'], lights:['#ff9e59','#ff4444']}, w:100, h:30, hp:55, speed:60, behavior:'bomber'},
    {name:'TELEPORT', colors:{body:'#c0f0ff', belly:'#5ab4d6', cockpit:['#ffffff','#9ed9ff','#3ab4ff'], lights:['#59deff','#59a0ff']}, w:85, h:28, hp:40, speed:120, behavior:'teleport'},
    {name:'BOSS TITAN', colors:{body:'#ffd700', belly:'#b89600', cockpit:['#ffffff','#ffec8a','#ffcc00'], lights:['#ff0000','#ffff00']}, w:160, h:48, hp:120, speed:45, behavior:'boss'},
  ];
  return configs[tier];
}

function createShip(level, index=0, total=1){
  const cfg=getShipConfig(level);
  const hpBase = cfg.hp + (level-1)* (cfg.behavior==='boss'?12:5);
  const dir=Math.random()>0.5?1:-1;
  const yBase = H*0.12 + (index*(H*0.25/total)) + Math.random()*H*0.15;
  return {
    x:dir===1?-120-index*150:W+120+index*150,
    y:yBase,
    w:cfg.w, h:cfg.h, hp:hpBase, maxHp:hpBase, dir, speed:cfg.speed+(level-1)*2,
    hitFlash:0, type:Math.floor((level-1)/10), cfg, ghostTimer:0, zigTimer:0, teleportTimer:0,
    originalY:yBase
  };
}

function initShips(lvl){
  const cfg=getShipConfig(lvl);
  const count = cfg.count || (cfg.behavior==='duo' ? 2 : 1);
  game.ships=[];
  for(let i=0;i<count;i++) game.ships.push(createShip(lvl,i,count));
  game.cross.speed=Math.max(80,(420+(lvl-1)*35)*(1-ups.c.main*0.012));
  game.power.speed=Math.max(20,(82+(lvl-1)*8)*(1-ups.p.main*0.015));
}

function startGame(fromLevel=1){
  game.level=fromLevel;game.points=fromLevel>1?(fromLevel-1)*100:0;game.misses=0;game.bullets=[];game.parts=[];
  game.power={v:50,dir:1,speed:82*(1-ups.p.main*0.015),state:'moving',locked:50};
  game.cross={x:W/2,y:H*0.62,dir:1,speed:420*(1-ups.c.main*0.012)};
  initShips(fromLevel);game.levelStart=performance.now();state='playing';adUses=0;renderUI();
}

function drawShip(s){
  if(s.cfg.behavior==='ghost'){
    s.ghostTimer+=0.016;
    if(Math.sin(s.ghostTimer*2)>0.7) return;
  }
  ctx.save();ctx.translate(s.x,s.y);
  const alpha = s.cfg.behavior==='ghost' ? 0.6+Math.sin(s.ghostTimer*5)*0.4 : 1;
  ctx.globalAlpha=alpha;
  if(s.hitFlash>0){ctx.shadowColor="#ff4444";ctx.shadowBlur=30;}else{ctx.shadowColor=s.cfg.colors.body;ctx.shadowBlur=s.type>=3?22:18;}
  ctx.fillStyle=s.hitFlash>0?"#ffaaaa":s.cfg.colors.body;ctx.beginPath();ctx.ellipse(0,6,s.w*0.52,s.h*0.72,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=s.hitFlash>0?"#ff5555":s.cfg.colors.belly;ctx.beginPath();ctx.ellipse(0,10,s.w*0.48,s.h*0.5,0,0,Math.PI);ctx.fill();
  ctx.shadowBlur=0;
  const g=ctx.createRadialGradient(-4,-6,2,0,-2,18);g.addColorStop(0,s.cfg.colors.cockpit[0]);g.addColorStop(0.3,s.cfg.colors.cockpit[1]);g.addColorStop(1,s.cfg.colors.cockpit[2]);
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,-4,s.w*0.28,s.h*0.85,0,Math.PI,Math.PI*2);ctx.fill();
  for(let i=-2;i<=2;i++){
    ctx.fillStyle=i%2===0?s.cfg.colors.lights[0]:s.cfg.colors.lights[1];
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=8;ctx.beginPath();
    const lx=i* (s.w/5.5);
    ctx.arc(lx,10, s.type===9?4.5 : 3.2,0,Math.PI*2);ctx.fill();
  }
  if(s.type===9){
    ctx.fillStyle="#ff0000";ctx.shadowColor="#ff0000";ctx.shadowBlur=12;ctx.fillRect(-s.w*0.4, -s.h*0.5, s.w*0.8, 4);
  }
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawCross(x,y,locked,t){
  ctx.save();ctx.translate(x,y);const sc=1+Math.sin(t*0.01)*0.12;ctx.scale(sc,sc);
  ctx.strokeStyle=locked?"rgba(255,222,89,0.95)":"rgba(255,255,255,0.92)";ctx.lineWidth=locked?2.2:1.8;ctx.shadowColor=locked?"#ffde59":"#ffffff";ctx.shadowBlur=locked?18:14;
  ctx.beginPath();ctx.arc(0,0,40,0,Math.PI*2);ctx.stroke();
  ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.stroke();
  ctx.lineWidth=locked?2.2:1.6;ctx.beginPath();ctx.moveTo(-62,0);ctx.lineTo(-22,0);ctx.moveTo(22,0);ctx.lineTo(62,0);ctx.moveTo(0,-62);ctx.lineTo(0,-22);ctx.moveTo(0,22);ctx.lineTo(0,62);ctx.stroke();
  ctx.fillStyle=locked?"#ffde59":"#ffffff";ctx.shadowColor="#ffde59";ctx.shadowBlur=16;ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();
  if(locked){ctx.shadowBlur=0;ctx.fillStyle="rgba(255,222,89,0.9)";ctx.font="900 10px monospace";ctx.textAlign="center";ctx.fillText("LOCK",0,-52);}
  ctx.restore();
}

function renderUI(){
  const ui=document.getElementById('ui');
  const cfg=getShipConfig(game.level);
  let h='';
  h+=`<div class="absolute top-0 left-0 right-0 p-3 md:p-5 flex justify-between items-start pointer-events-auto">
    <div><div class="flex items-center gap-2"><div class="w-7 h-7 rounded-full bg-white text-[#21418f] font-black text-[13px] flex items-center justify-center">W</div><span class="text-white font-black tracking-[0.18em] text-[11px]">wasa.chat</span><span class="ml-2 text-[8px] px-1.5 py-0.5 rounded bg-white/15 text-white/70 tracking-widest">${cfg.name} • NIVEL ${game.level}/100</span>
    ${state==='playing'?`<button onclick="openPause()" class="ml-3 w-7 h-7 rounded-full bg-white/10 border border-white/20 text-white text-[12px] flex items-center justify-center hover:bg-white/20">⏸</button>`:''}
    </div>
    <div class="flex gap-2 mt-3"><div class="bg-black/35 backdrop-blur px-3.5 py-1.5 rounded-full text-white text-[11px] font-black border border-white/10">NIVEL ${game.level}</div><div class="bg-black/35 backdrop-blur px-3.5 py-1.5 rounded-full text-white text-[11px] font-black border border-white/10">${game.points} PTS</div><div class="bg-[#ffde59] text-black px-3 py-1.5 rounded-full text-[11px] font-black border-2 border-black">💰 ${coins}</div></div></div>
    <div class="flex flex-col items-end gap-2"><div class="flex items-center gap-2 bg-black/30 backdrop-blur px-3 py-1.5 rounded-full border border-white/10"><span class="text-[9px] text-white/60 font-bold tracking-widest">TIROS</span><div class="flex gap-1.5">${Array.from({length:5}).map((_,i)=>`<div class="w-2.5 h-2.5 rounded-full ${i<5-game.misses?'bg-[#ffde59] shadow-[0_0_10px_#ffde59]':'bg-white/15'}"></div>`).join('')}</div></div><div class="flex flex-col gap-1.5 items-end">${game.ships.map(s=>`<div class="bg-black/50 backdrop-blur border border-white/15 rounded-full pl-1 pr-3 py-1 flex items-center gap-2"><div class="w-[56px] h-[6px] bg-black/40 rounded-full p-[1px]"><div class="h-full rounded-full" style="width:${Math.max(0,s.hp/s.maxHp*100)}%;background:${s.hp/s.maxHp>0.5?'linear-gradient(90deg,#4ade80,#22c55e)':'linear-gradient(90deg,#facc15,#f59e0b)'}"></div></div><span class="text-[11px] font-black ${s.hp/s.maxHp<0.3?'text-red-300':'text-white'}">${s.hp}</span><span class="text-[8px] text-white/40">/ ${s.maxHp}</span></div>`).join('')}</div>${state==='playing'?`<button onclick="openPause()" class="mt-1 text-[9px] text-white/50 border border-white/10 rounded-full px-2 py-1 bg-black/20 hover:bg-white/10">MENU • PAUSA</button>`:''}</div>
  </div>`;

  if(state==='playing'){
    h+=`<div class="absolute top-[92px] left-1/2 -translate-x-1/2 pointer-events-none flex flex-col items-center gap-1">
      ${game.power.state==='moving'?`<div class="bg-[#ffde59] text-black font-black text-[10px] tracking-[0.14em] px-4 py-2 rounded-full border-2 border-black shadow-[0_4px_0_#000] animate-pulse">1° CLICK: FIJAR POTENCIA → 2° CLICK: DISPARAR</div>`:`<div class="bg-white text-black font-black text-[11px] tracking-[0.14em] px-5 py-2 rounded-full border-2 border-black">POTENCIA ${Math.round(game.power.locked)}% FIJADA • ¡DISPARA! 🎯</div>`}
      <div class="text-[8px] text-white/50 font-mono bg-black/20 px-2 py-1 rounded-full mt-1">${cfg.name} • ${game.ships.length} nave(s)</div>
    </div>
    <div class="absolute bottom-0 left-0 right-0 p-2 md:p-4 flex justify-between items-end pointer-events-none gap-2">
      <!-- IZQUIERDA: BARRA POTENCIA CON ANCHO FIJO -->
      <div class="pointer-events-auto flex flex-col items-center gap-2 w-[90px] shrink-0"><div id="power-label" class="text-[9px] font-black tracking-[0.22em] text-white/80 w-[90px] text-center whitespace-nowrap">POTENCIA ${Math.round(game.power.v)}%</div>
      <div id="power-container" class="relative w-[40px] h-[160px] md:h-[180px] backdrop-blur-xl rounded-[18px] border p-1.5 flex flex-col justify-end overflow-hidden ${game.power.state==='locked'?'bg-[#ffde59]/15 border-[#ffde59]/60':'bg-black/45 border-white/15'}"><div id="power-fill" class="w-full rounded-[12px]" style="height:${game.power.state==='locked'?game.power.locked:game.power.v}%;background:${game.power.state==='locked'?'linear-gradient(180deg,#fffe8a,#ffde59 50%,#ff8a2a)':'linear-gradient(180deg,#fff7a0,#ffde59 60%,#ff6a2a)'}"></div><div id="power-line" class="absolute left-0 right-0 h-[3px] bg-white shadow-[0_0_12px_white]" style="bottom:${game.power.state==='locked'?game.power.locked:game.power.v}%"></div></div>
      <button id="power-btn" onclick="togglePower()" class="pointer-events-auto w-[90px] px-1 py-2 rounded-full font-black text-[8px] tracking-[0.08em] border text-center whitespace-nowrap ${game.power.state==='locked'?'bg-[#ffde59] text-black border-black shadow-[0_3px_0_#000]':'bg-white/10 text-white border-white/20'}">${game.power.state==='locked'?Math.round(game.power.locked)+'% DESBLOQ':'FIJAR'}</button></div>
      
      <!-- CENTRO IZQUIERDA: INFO HORIZONTAL ABAJO A LA IZQUIERDA DEL CAÑON -->
      <div class="pointer-events-auto flex items-end gap-2 flex-1 justify-start ml-2 md:ml-6 mb-1">
        <div id="bullet-info-horizontal" class="bg-black/60 backdrop-blur-xl border border-white/15 rounded-full px-3.5 py-2 flex items-center gap-3">
          <div class="flex items-center gap-1.5"><span class="text-[7px] font-black tracking-widest text-white/40">PODER BALA</span><span id="dmg-val" class="text-[11px] font-black text-[#ffde59]">${50+ups.d.main} DMG</span></div>
          <div class="w-px h-3 bg-white/15"></div>
          <div class="flex items-center gap-1.5"><span class="text-[7px] font-black tracking-widest text-white/40">POTENCIA</span><span id="pot-val" class="text-[11px] font-black text-white">${game.power.state==='locked'?Math.round(game.power.locked):Math.round(game.power.v)}%</span></div>
          <div class="w-px h-3 bg-white/15"></div>
          <div class="flex items-center gap-1.5"><span class="text-[7px] font-black tracking-widest text-white/40">VIDA ENEMIGA</span><span id="enemy-hp-val" class="text-[11px] font-black text-white">${game.ships.length>0?game.ships[0].hp:0}/${game.ships.length>0?game.ships[0].maxHp:0}</span></div>
        </div>
      </div>

      <!-- DERECHA: BOTON DISPARAR LEJOS DEL CAÑON -->
      <div class="pointer-events-auto flex flex-col items-center gap-2 shrink-0 mb-1">
        <button id="shoot-btn" onclick="handleShoot()" class="font-black text-[13px] md:text-[15px] tracking-[0.12em] px-7 md:px-10 py-3.5 md:py-4 rounded-full border-[2.5px] border-black shadow-[0_6px_0_#000] active:translate-y-[5px] ${game.power.state==='locked'?'bg-[#ffde59] text-black shadow-[0_6px_0_#000,0_0_24px_rgba(255,222,89,0.5)]':'bg-white/20 text-white/70 border-white/20'}">${game.power.state==='moving'?'FIJAR POTENCIA':'DISPARAR ↗'}</button>
      </div>
    </div>`;
  }

  if(state==='menu'){
    h+=`<div class="absolute inset-0 flex items-center justify-center p-4 bg-[#21418f]/55 backdrop-blur-[10px] pointer-events-auto"><div class="w-full max-w-[560px] rounded-[28px] bg-[#0f1b3e]/90 border border-white/15 shadow-[0_24px_80px_rgba(0,0,0,0.6)] overflow-hidden">
      <div class="p-7 md:p-9"><div class="flex items-center justify-between"><div class="flex items-center gap-2"><div class="w-9 h-9 rounded-full bg-white text-[#21418f] font-black flex items-center justify-center">W</div><span class="text-white font-black tracking-[0.2em] text-[12px]">wasa.chat</span></div><div class="text-[9px] tracking-[0.2em] text-white/50 font-bold border border-white/10 rounded-full px-2.5 py-1">100 NIVELES • 10 NAVES</div></div>
      <h1 class="mt-6 text-white font-black text-[34px] md:text-[42px] leading-[0.9]">CAZA LA<br><span class="text-[#ffde59]">FLOTA</span></h1>
      <p class="mt-3 text-white/65 text-[13px]">Mismo juego que anda perfecto. Hasta nivel 100 con 10 naves boss. Checkpoint cada 10 niveles.</p>
      <div class="mt-3 bg-white/5 border border-white/10 rounded-2xl p-3 flex justify-between items-center"><div><div class="text-[10px] text-white/40 font-bold tracking-widest">MAX NIVEL DESBLOQUEADO</div><div class="text-[#ffde59] font-black text-[18px]">NIVEL ${maxLevel} • ${getShipConfig(maxLevel).name}</div></div><div class="text-[20px]">🚀</div></div>
      <div class="mt-6 flex flex-col gap-3">
        <button onclick="startGame(1);renderUI()" class="w-full bg-white/10 text-white font-black tracking-[0.14em] text-[12px] py-3.5 rounded-full border border-white/15">JUGAR DESDE NIVEL 1 • FARMEAR MONEDAS</button>
        <button onclick="continueFromCheckpoint()" class="w-full bg-[#ffde59] text-black font-black tracking-[0.18em] text-[13px] py-4 rounded-full border-[2.5px] border-black shadow-[0_6px_0_#000]">CONTINUAR DESDE NIVEL ${maxLevel} ${maxLevel>1?'• 100 💰 O ANUNCIO':''}</button>
        <div class="grid grid-cols-2 gap-3"><button onclick="state='shop';renderUI()" class="bg-white/[0.08] text-white font-black tracking-[0.14em] text-[12px] py-3.5 rounded-full border border-white/15">MEJORAS • ${ups.d.main+ups.c.main+ups.p.main}/150</button><button onclick="state='ranking';renderUI()" class="bg-white/[0.08] text-white font-black tracking-[0.14em] text-[12px] py-3.5 rounded-full border border-white/15">RANKING TOP 10</button></div>
      </div>
      <div class="mt-4 grid grid-cols-5 gap-2">${Array.from({length:10}).map((_,i)=>{
        const lvl=i*10+1;const unlocked=maxLevel>=lvl;const cfg2=getShipConfig(lvl);
        // mini nave dibujada con los colores reales
        const mini = `<div class="relative mx-auto w-[38px] h-[16px] flex items-center justify-center">
          <div class="absolute w-[32px] h-[10px] rounded-full" style="background:${cfg2.colors.body};box-shadow:0 0 8px ${cfg2.colors.body};opacity:${unlocked?1:0.5}"></div>
          <div class="absolute w-[32px] h-[5px] rounded-b-full top-[8px]" style="background:${cfg2.colors.belly};opacity:${unlocked?0.9:0.4}"></div>
          <div class="absolute w-[10px] h-[6px] rounded-full top-[2px]" style="background:radial-gradient(circle, ${cfg2.colors.cockpit[0]} 0%, ${cfg2.colors.cockpit[1]} 40%, ${cfg2.colors.cockpit[2]} 100%);"></div>
          <div class="absolute flex gap-[3px] top-[9px]">${[0,1,2].map(j=>`<div class="w-[3px] h-[3px] rounded-full" style="background:${j%2===0?cfg2.colors.lights[0]:cfg2.colors.lights[1]};box-shadow:0 0 4px ${j%2===0?cfg2.colors.lights[0]:cfg2.colors.lights[1]}"></div>`).join('')}</div>
          ${cfg2.name==='BOSS TITAN'?`<div class="absolute w-[30px] h-[1.5px] top-[1px] bg-red-500 shadow-[0_0_4px_red]"></div>`:''}
        </div>`;
        return `<div class="rounded-xl border p-2 text-center transition-all ${unlocked?'bg-[#ffde59]/20 border-[#ffde59]/40 shadow-[0_0_12px_rgba(255,222,89,0.2)]':'bg-white/5 border-white/10 opacity-40'}">
          ${mini}
          <div class="text-[7px] text-white/40 mt-1">NVL ${lvl}</div>

let buyingLock=false;
function buySub(id){
  if(buyingLock) return;
  const cur=ups[id];if(cur.main>=50)return;const cost=cur.main+1;if(coins<cost)return;
  buyingLock=true;
  coins-=cost;localStorage.setItem('wasa_coins_final',coins);
  cur.sub+=1;
  ups[id]=cur;
  localStorage.setItem('wasa_upgrades_final',JSON.stringify(ups));
  renderUI(); // muestra 5/5 lleno
  if(cur.sub>=5){
    // Mostrar 5/5 durante 500ms con animación
    setTimeout(()=>{
      cur.main+=1;cur.sub=0;
      ups[id]=cur;
      localStorage.setItem('wasa_upgrades_final',JSON.stringify(ups));
      // efecto flash de nivel up
      const el=document.getElementById('upgrade-'+id);
      if(el){ el.classList.add('ring-2','ring-[#ffde59]'); setTimeout(()=>el.classList.remove('ring-2','ring-[#ffde59]'),300); }
      buyingLock=false;
      renderUI();
    },550);
  }else{
    buyingLock=false;
  }
}

    ranking.push({name:'Jugador',score:game.points,level:game.level});ranking.sort((a,b)=>b.score-a.score);ranking=ranking.slice(0,10);localStorage.setItem('wasa_ranking_final',JSON.stringify(ranking));
    game.level+=1;game.misses=0;game.bullets=[];game.power.state='moving';game.power.v=20;initShips(game.level);game.levelStart=performance.now();state='playing';
  }else if(type==='checkpoint'){
    startGame(maxLevel);state='playing';
  }
  renderUI();
}
function claimAd(){ claimReward(); }

function togglePower(){if(state!=='playing')return;if(game.power.state==='moving'){game.power.state='locked';game.power.locked=Math.round(game.power.v||65);}else{game.power.state='moving';}renderUI();}
function handleShoot(){
  if(state!=='playing')return;
  if(game.power.state==='moving'){game.power.state='locked';game.power.locked=Math.round(game.power.v||65);renderUI();return;}
  if(game.bullets.length>0)return;
  const vel=260+game.power.locked*5.2+(game.level-1)*8;
  const cx=W/2,cy=H-88;const tx=game.cross.x,ty=game.cross.y;const dy=cy-ty;const time=Math.max(dy/vel,0.18);const vx=(tx-cx)/time,vy=-vel;
  game.bullets.push({x:cx,y:cy,vx,vy,trail:[]});
}

function loop(now){
  if(window._gm_isAdPlaying || state==='reward_modal' || state==='custom_ad' || (ad && ad.type!==null)){
    requestAnimationFrame(loop);
    return;
  }

  const dt=Math.min((now-last)/1000,0.033);last=now;
  if(state==='playing'){
    for(let s of game.ships){
      if(s.cfg.behavior==='zigzag' || s.cfg.behavior==='zigzag_fast'){
        s.zigTimer+=dt* (s.cfg.behavior==='zigzag_fast'?4:2);
        s.y = s.originalY + Math.sin(s.zigTimer)* (s.cfg.behavior==='zigzag_fast'?80:40);
      }
      if(s.cfg.behavior==='teleport'){
        s.teleportTimer+=dt;
        if(s.teleportTimer>2.5){s.teleportTimer=0; s.x = Math.random()*(W-100)+50; s.y = H*0.1+Math.random()*H*0.35;}
      }
      s.x+=s.dir*s.speed*dt;
      if(s.dir===1&&s.x>W+140){s.x=-140;s.y=H*0.1+Math.random()*H*0.32;s.originalY=s.y;s.dir=Math.random()>0.5?1:-1;if(s.dir===-1)s.x=W+140;}
      else if(s.dir===-1&&s.x<-140){s.x=W+140;s.y=H*0.1+Math.random()*H*0.32;s.originalY=s.y;s.dir=Math.random()>0.5?1:-1;if(s.dir===1)s.x=-140;}
      if(s.hitFlash>0)s.hitFlash-=dt*4;
    }
    game.cross.x+=game.cross.dir*game.cross.speed*dt;
    if(game.cross.x>W-30){game.cross.x=W-30;game.cross.dir=-1;}
    if(game.cross.x<30){game.cross.x=30;game.cross.dir=1;}
    if(game.power.state==='moving'){game.power.v+=game.power.dir*game.power.speed*dt;if(game.power.v>=100){game.power.v=100;game.power.dir=-1;}if(game.power.v<=0){game.power.v=0;game.power.dir=1;}}else game.power.v=game.power.locked;
    for(let i=game.bullets.length-1;i>=0;i--){
      const b=game.bullets[i];b.trail.push({x:b.x,y:b.y});if(b.trail.length>8)b.trail.shift();b.x+=b.vx*dt;b.y+=b.vy*dt;
      let hit=false;
      for(let sIdx=game.ships.length-1;sIdx>=0;sIdx--){
        const sh=game.ships[sIdx];
        if(Math.abs(b.y-sh.y)<28&&Math.abs(b.x-sh.x)<sh.w*0.5){
          const dmg=50+ups.d.main;sh.hp-=dmg;sh.hitFlash=1;
          for(let k=0;k<18;k++){const ang=Math.random()*Math.PI*2,sp=Math.random()*180+40;game.parts.push({x:sh.x,y:sh.y,vx:Math.cos(ang)*sp+sh.dir*20,vy:Math.sin(ang)*sp,life:1,size:Math.random()*3+1.5,color:Math.random()>0.5?"#ffde59":"#ff8a4d"});}
          game.bullets.splice(i,1);game.power.state='moving';hit=true;
          if(sh.hp<=0){
            game.ships.splice(sIdx,1);
            for(let k=0;k<32;k++){const ang=Math.random()*Math.PI*2,sp=Math.random()*320+40;game.parts.push({x:sh.x,y:sh.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1,size:Math.random()*5+2,color:`hsl(${40+Math.random()*30},100%,60%)`});}
            if(game.ships.length===0){
              const elapsed = (performance.now() - game.levelStart)/1000;
              tempPoints=100*game.level;
              // base 1/4 de lo que daba antes
              const baseCoins = (20+game.level*5)/15;
              let mult = 1;
              if(elapsed < 10) mult = 2;
              else if(elapsed < 20) mult = 1.75;
              else if(elapsed < 30) mult = 1.5;
              else mult = 1;
              tempCoins = Math.round(baseCoins * mult);
              // guardar datos para mostrar
              game.lastTime = elapsed;
              game.lastMult = mult;
              game.lastBase = Math.round(baseCoins);
              game.points+=tempPoints;
              levelUpInfo={level:game.level+1,points:game.points};
              state='levelup';renderUI();
              setTimeout(()=>{if(state==='levelup'){continueWithoutDouble();}},5000);
            }
          }
          break;
        }
      }
      if(hit) continue;
      if(b.y<-30||b.x<-30||b.x>W+30){game.bullets.splice(i,1);game.misses+=1;game.power.state='moving';if(game.misses>=5){state='gameover';renderUI();}}
    }
  }
  for(let i=game.parts.length-1;i>=0;i--){const p=game.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.98;p.vy+=80*dt;p.life-=dt*0.9;if(p.life<=0)game.parts.splice(i,1);}

  const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,"#21418f");grad.addColorStop(1,"#5e80e1");ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  for(const s of game.stars){const a=0.5+Math.sin(now*0.001*s.tw+s.off)*0.5;ctx.fillStyle=`rgba(255,255,255,${0.3+a*0.7})`;ctx.beginPath();ctx.arc(s.x,s.y,s.size*(0.7+a*0.6),0,Math.PI*2);ctx.fill();}
  const vign=ctx.createRadialGradient(W/2,H*0.35,H*0.2,W/2,H*0.35,H);vign.addColorStop(0,"rgba(0,0,0,0)");vign.addColorStop(1,"rgba(0,0,0,0.35)");ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);
  for(let sh of game.ships) drawShip(sh);
  if(state==='playing'||state==='levelup'){
    for(const b of game.bullets){for(let j=0;j<b.trail.length;j++){const t=b.trail[j],a=j/b.trail.length;ctx.fillStyle=`rgba(255,222,89,${a*0.6})`;ctx.beginPath();ctx.arc(t.x,t.y,2+a*2,0,Math.PI*2);ctx.fill();}ctx.shadowColor="#ffde59";ctx.shadowBlur=16;ctx.fillStyle="#fffe8a";ctx.beginPath();ctx.arc(b.x,b.y,5.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
    for(const p of game.parts){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;}
    if(state==='playing') drawCross(game.cross.x,game.cross.y,game.power.state==='locked',now);
    const cx=W/2,cy=H-100;ctx.save();ctx.translate(cx,cy);ctx.shadowColor="#ffde59";ctx.shadowBlur=20;ctx.fillStyle="#1a2a5a";ctx.beginPath();ctx.ellipse(0,0,26,10,0,0,Math.PI*2);ctx.fill();if(state==='playing'){const ang=Math.atan2(game.cross.y-cy,game.cross.x-cx);ctx.rotate(ang);ctx.fillStyle="#e6e8ff";ctx.fillRect(0,-5,36,10);ctx.fillStyle="#ffde59";ctx.fillRect(32,-3,10,6);}ctx.restore();
  }
  if(state==='playing'){
    const pl=document.getElementById('power-label');
    const pf=document.getElementById('power-fill');
    const pln=document.getElementById('power-line');
    const potVal=document.getElementById('pot-val');
    const dmgVal=document.getElementById('dmg-val');
    const ehVal=document.getElementById('enemy-hp-val');
    if(pl) pl.textContent = game.power.state==='locked' ? `POTENCIA • BLOQ ${Math.round(game.power.locked)}%` : `POTENCIA ${Math.round(game.power.v)}%`;
    if(pf) pf.style.height = (game.power.state==='locked'?game.power.locked:game.power.v)+'%';
    if(pln) pln.style.bottom = (game.power.state==='locked'?game.power.locked:game.power.v)+'%';
    const curPow = game.power.state==='locked'?game.power.locked:game.power.v;
    if(potVal) potVal.textContent = Math.round(curPow)+'%';
    if(dmgVal) dmgVal.textContent = (50+ups.d.main)+' DMG';
    if(ehVal && game.ships.length>0) ehVal.textContent = game.ships[0].hp+'/'+game.ships[0].maxHp;
  }
  requestAnimationFrame(loop);
}
renderUI();
initShips(1);
requestAnimationFrame(loop);
canvas.addEventListener('pointerdown',e=>{if(e.target.closest('button')) return; if(state==='playing') handleShoot();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(state==='menu'){startGame(1);renderUI();}else if(state==='playing'){handleShoot();}} if(e.code==='Escape'){if(state==='playing') openPause(); else if(state==='paused') closePause();}});
</script>
</body>
</html>
