<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wasa.chat - founders</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{radial-gradient(ellipse at 50% 0%, rgba(79, 70, 229, 0.15) 0%, transparent 70%), radial-gradient(ellipse at 100% 80%, rgba(245, 158, 11, 0.10) 0%, transparent 60%), linear-gradient(180deg, #21418f 0%, #332891 40%, #5e80e1 100%);overflow:hidden}
#hero{position:relative;width:100vw;height:100vh}
#starCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#logo-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;display:flex;align-items:baseline;justify-content:center;gap:clamp(3px,1vw,10px);width:92vw;max-width:900px;perspective:1000px}
.letter{height:clamp(36px,11vw,100px);width:auto;object-fit:contain;display:block;will-change:transform;transform-style:preserve-3d;transition:transform 0.8s cubic-bezier(0.68,-0.6,0.32,1.6);flex-shrink:1;filter:brightness(0)}
#logo-wrap.letter.dot{height:clamp(8px,2.2vw,20px);width:clamp(8px,2.2vw,20px);margin-bottom:clamp(18px,5.5vw,42px);margin-left:2px;margin-right:2px}
#subtitle{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:clamp(12px,2.5vw,24px);white-space:nowrap;color:#111;font-size:clamp(7px,1.6vw,11px);letter-spacing:clamp(2px,0.5vw,4px);opacity:0.7}
@media (max-width:480px){#logo-wrap{width:94vw;gap:3px}.letter{height:10.8vw}#logo-wrap.letter.dot{height:2.6vw;width:2.6vw;margin-bottom:4.2vw}}
</style>
</head>
<body>
<div id="hero">
  <canvas id="starCanvas"></canvas>
  <div id="logo-wrap">
    <img src="/assets/img/w.png" class="letter" alt="w">
    <img src="/assets/img/a.png" class="letter" alt="a">
    <img src="/assets/img/s.png" class="letter" alt="s">
    <img src="/assets/img/a2.png" class="letter" alt="a">
    <img src="/assets/img/punto.png" class="letter dot" alt=".">
    <img src="/assets/img/c.png" class="letter" alt="c">
    <img src="/assets/img/h.png" class="letter" alt="h">
    <img src="/assets/img/a3.png" class="letter" alt="a">
    <img src="/assets/img/t.png" class="letter" alt="t">
    <div id="subtitle">WASA.CHAT — DIC 15 2026 — FOUNDERS</div>
  </div>
</div>

<script>
// FONDO ESPACIO - SIEMPRE VISIBLE, SIN BORRAR
const starCanvas=document.getElementById('starCanvas'), sCtx=starCanvas.getContext('2d');
let stars=[];
function initStars(){
  starCanvas.width=innerWidth; starCanvas.height=innerHeight;
  stars=[];
  for(let i=0;i<300;i++){
    stars.push({
      x: Math.random()*starCanvas.width,
      y: Math.random()*starCanvas.height,
      r: Math.random()*1.4+0.2,
      speed: Math.random()*0.5+0.15,
      alpha: Math.random()*0.7+0.3,
      twinkle: Math.random()*0.04
    });
  }
}
function drawStars(){
  // usa tu degradado de fondo
  const grad = sCtx.createLinearGradient(0,0,0,starCanvas.height);
  grad.addColorStop(0,'#EEF2FF');
  grad.addColorStop(0.4,'#F6F8FE');
  grad.addColorStop(1,'#FEF3C7');
  sCtx.fillStyle=grad;
  sCtx.fillRect(0,0,starCanvas.width,starCanvas.height);

  stars.forEach(s=>{
    s.y -= s.speed;
    s.alpha += (Math.random()-0.5)*s.twinkle;
    s.alpha = Math.max(0.2, Math.min(1, s.alpha));
    if(s.y < -10){ s.y = starCanvas.height+10; s.x = Math.random()*starCanvas.width; }
    sCtx.beginPath();
    sCtx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    sCtx.fillStyle=`rgba(17,17,17,${s.alpha})`; // estrellas oscuras sobre fondo claro
    sCtx.fill();
  });
  requestAnimationFrame(drawStars);
}
initStars(); drawStars();
addEventListener('resize', initStars);

// KINETIC LOGO - solo cuando pasas el mouse cerca
const letters=document.querySelectorAll('.letter'); let tmr;
function scatter(mx,my){
  const r=document.getElementById('logo-wrap').getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  if(Math.hypot(mx-cx,my-cy)>400)return;
  letters.forEach(el=>{
    if(el._busy)return;
    el.style.transform=`translate3d(${(Math.random()-0.5)*280}px,${(Math.random()-0.5)*180}px,80px) rotate(${(Math.random()-0.5)*540}deg) rotateX(${(Math.random()-0.5)*180}deg) scale(${0.7+Math.random()*0.6})`;
    el._busy=true;setTimeout(()=>el._busy=false,900);
  });
  clearTimeout(tmr);tmr=setTimeout(()=>letters.forEach((el,i)=>setTimeout(()=>el.style.transform='none',i*60)),800);
}
document.addEventListener('mousemove', e=>scatter(e.clientX,e.clientY));
document.addEventListener('touchmove', e=>{const t=e.touches[0];scatter(t.clientX,t.clientY)},{passive:false});
</script>
</body>
</html>
