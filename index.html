<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wasa.chat - Arcade</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>body{margin:0;background:#21418f;overflow:hidden;font-family:Inter,system-ui,sans-serif}canvas{touch-action:none}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect,useCallback}=React;
function App(){
  const canvasRef=useRef(null);
  const gameRef=useRef({ship:{x:-120,y:120,w:78,h:26,hp:20,maxHp:20,dir:1,speed:90,hitFlash:0},crosshair:{x:400,y:0,dir:1,speed:420},power:{value:0,dir:1,speed:82,state:"moving",lockedValue:50},bullets:[],particles:[],stars:[],level:1,points:0,misses:0,width:800,height:600});
  const [view,setView]=useState('menu');
  const [hud,setHud]=useState({level:1,points:0,misses:0,power:0,powerLocked:false,powerLockedVal:50,shipHp:20,shipMax:20});
  const [levelUpInfo,setLevelUpInfo]=useState({level:2,points:0});
  const [showAd,setShowAd]=useState(null);
  const [adTimer,setAdTimer]=useState(5);
  const [adUnlocked,setAdUnlocked]=useState(false);
  const [coins,setCoins]=useState(()=>parseInt(localStorage.getItem('wasa_coins_final')||'0'));
  const [upgrades,setUpgrades]=useState(()=>{try{return JSON.parse(localStorage.getItem('wasa_upgrades_final')||'{"damage":{"main":0,"sub":0},"crosshair":{"main":0,"sub":0},"power":{"main":0,"sub":0}}')}catch{return {damage:{main:0,sub:0},crosshair:{main:0,sub:0},power:{main:0,sub:0}}}});
  const [adUses,setAdUses]=useState(0);
  const [tempCoins,setTempCoins]=useState(0);
  const [flash,setFlash]=useState(false);
  const initStars=useCallback((w,h)=>{const arr=[];for(let i=0;i<140;i++)arr.push({x:Math.random()*w,y:Math.random()*h*0.85,size:Math.random()*1.8+0.3,twinkle:Math.random()*2+0.5,offset:Math.random()*Math.PI*2});gameRef.current.stars=arr;},[]);
  const initShip=useCallback((lvl,w,h)=>{const hp=20+(lvl-1)*10;const dir=Math.random()>0.5?1:-1;const crossSpeed=(420+(lvl-1)*55)*(1-upgrades.crosshair.main*0.012);const powerSpeed=(82+(lvl-1)*12)*(1-upgrades.power.main*0.015);gameRef.current.ship={x:dir===1?-120:w+120,y:h*0.12+Math.random()*(h*0.33),w:78+Math.min(lvl*2,18),h:26,hp,maxHp:hp,dir,speed:90+(lvl-1)*18,hitFlash:0};gameRef.current.crosshair.speed=Math.max(80,crossSpeed);gameRef.current.power.speed=Math.max(20,powerSpeed);},[upgrades]);
  const startGame=useCallback(()=>{const g=gameRef.current;g.level=1;g.points=0;g.misses=0;g.bullets=[];g.particles=[];g.power={value:50,dir:1,speed:82*(1-upgrades.power.main*0.015),state:"moving",lockedValue:50};g.crosshair={x:g.width/2,y:g.height*0.62,dir:1,speed:420*(1-upgrades.crosshair.main*0.012)};initShip(1,g.width,g.height);setHud({level:1,points:0,misses:0,power:50,powerLocked:false,powerLockedVal:50,shipHp:20,shipMax:20});setView('playing');setAdUses(0);},[initShip,upgrades]);
  const fixPower=useCallback(()=>{const g=gameRef.current;if(g.power.state==="moving"){g.power.state="locked";g.power.lockedValue=Math.round(g.power.value||65);setHud(s=>({...s,powerLocked:true,powerLockedVal:g.power.lockedValue}));setFlash(true);setTimeout(()=>setFlash(false),180);return true;}return false;},[]);
  const shoot=useCallback(()=>{const g=gameRef.current;if(view!=='playing')return;if(g.misses>=5)return;if(g.power.state!=="locked")return;if(g.bullets.length>0)return;const vel=260+g.power.lockedValue*5.2+(g.level-1)*14;const cx=g.width/2,cy=g.height-88;const tx=g.crosshair.x,ty=g.crosshair.y;const dy=cy-ty;const time=Math.max(dy/vel,0.18);const vx=(tx-cx)/time,vy=-vel;g.bullets.push({x:cx,y:cy,vx,vy,trail:[],active:true});setFlash(true);setTimeout(()=>setFlash(false),220);},[view]);
  const handleInput=useCallback(()=>{if(view!=='playing')return;const g=gameRef.current;if(g.power.state==="moving")fixPower();else shoot();},[view,fixPower,shoot]);
  const openAd=(t)=>{setShowAd(t);setAdTimer(5);setAdUnlocked(false);};
  useEffect(()=>{if(!showAd)return;const id=setInterval(()=>{setAdTimer(x=>{if(x<=1){setAdUnlocked(true);clearInterval(id);return 0;}return x-1;});},1000);return ()=>clearInterval(id);},[showAd]);
  const claimAd=()=>{if(!adUnlocked)return;const g=gameRef.current;if(showAd==='lives'){g.misses=Math.max(0,g.misses-3);g.bullets=[];g.power.state="moving";g.power.value=50;g.power.dir=1;setHud(s=>({...s,misses:g.misses}));setShowAd(null);setAdUses(a=>a+1);}else if(showAd==='double'){const doubled=tempCoins*2;const newCoins=coins+doubled;setCoins(newCoins);localStorage.setItem('wasa_coins_final',newCoins);setShowAd(null);setTimeout(()=>{g.level=levelUpInfo.level;g.misses=0;g.bullets=[];g.power.state="moving";g.power.value=20;g.power.dir=1;initShip(g.level,g.width,g.height);setView('playing');},300);}};
  useEffect(()=>{const canvas=canvasRef.current;if(!canvas)return;const ctx=canvas.getContext('2d');let anim;
  const drawShip=(c,s)=>{c.save();c.translate(s.x,s.y);if(s.hitFlash>0){c.shadowColor="#ff4444";c.shadowBlur=30;}else{c.shadowColor="#7ea8ff";c.shadowBlur=18;}c.fillStyle=s.hitFlash>0?"#ffaaaa":"#cfe0ff";c.beginPath();c.ellipse(0,6,s.w*0.52,s.h*0.72,0,0,Math.PI*2);c.fill();c.fillStyle=s.hitFlash>0?"#ff5555":"#5a7bd6";c.beginPath();c.ellipse(0,10,s.w*0.48,s.h*0.5,0,0,Math.PI);c.fill();c.shadowBlur=0;const grad=c.createRadialGradient(-4,-6,2,0,-2,18);grad.addColorStop(0,"#ffffff");grad.addColorStop(0.3,"#9ef0ff");grad.addColorStop(1,"#3a6bff");c.fillStyle=grad;c.beginPath();c.ellipse(0,-4,s.w*0.28,s.h*0.85,0,Math.PI,Math.PI*2);c.fill();for(let i=-2;i<=2;i++){c.fillStyle=i%2===0?"#ffde59":"#ff6b6b";c.shadowColor=c.fillStyle;c.shadowBlur=8;c.beginPath();c.arc(i*14,10,3.2,0,Math.PI*2);c.fill();}c.restore();};
  const drawCross=(c,x,y,t,locked)=>{c.save();c.translate(x,y);const sc=1+Math.sin(t*0.01)*0.12;c.scale(sc,sc);c.strokeStyle=locked?"rgba(255,222,89,0.95)":"rgba(255,255,255,0.92)";c.lineWidth=locked?2.2:1.8;c.shadowColor=locked?"#ffde59":"#ffffff";c.shadowBlur=locked?18:14;c.beginPath();c.arc(0,0,40,0,Math.PI*2);c.stroke();c.lineWidth=1.8;c.beginPath();c.arc(0,0,14,0,Math.PI*2);c.stroke();c.lineWidth=locked?2.2:1.6;c.beginPath();c.moveTo(-62,0);c.lineTo(-22,0);c.moveTo(22,0);c.lineTo(62,0);c.moveTo(0,-62);c.lineTo(0,-22);c.moveTo(0,22);c.lineTo(0,62);c.stroke();c.fillStyle=locked?"#ffde59":"#ffffff";c.shadowColor="#ffde59";c.shadowBlur=16;c.beginPath();c.arc(0,0,5,0,Math.PI*2);c.fill();if(locked){c.shadowBlur=0;c.fillStyle="rgba(255,222,89,0.9)";c.font="900 10px monospace";c.textAlign="center";c.fillText("LOCK",0,-52);}c.restore();};
  const resize=()=>{const dpr=window.devicePixelRatio||1;const w=window.innerWidth,h=window.innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+"px";canvas.style.height=h+"px";ctx.setTransform(dpr,0,0,dpr,0,0);gameRef.current.width=w;gameRef.current.height=h;gameRef.current.crosshair.y=h*0.62;if(gameRef.current.stars.length===0)initStars(w,h);};
  resize();window.addEventListener('resize',resize);
  let last=performance.now();
  const loop=(now)=>{anim=requestAnimationFrame(loop);const g=gameRef.current;const dt=Math.min((now-last)/1000,0.033);last=now;const W=g.width,H=g.height;
    if(view==='playing'){
      g.ship.x+=g.ship.dir*g.ship.speed*dt;
      if(g.ship.dir===1&&g.ship.x>W+140){g.ship.x=-140;g.ship.y=H*0.1+Math.random()*H*0.32;g.ship.dir=Math.random()>0.5?1:-1;if(g.ship.dir===-1)g.ship.x=W+140;}
      else if(g.ship.dir===-1&&g.ship.x<-140){g.ship.x=W+140;g.ship.y=H*0.1+Math.random()*H*0.32;g.ship.dir=Math.random()>0.5?1:-1;if(g.ship.dir===1)g.ship.x=-140;}
      if(g.ship.hitFlash>0)g.ship.hitFlash-=dt*4;
      g.crosshair.x+=g.crosshair.dir*g.crosshair.speed*dt;
      if(g.crosshair.x>W-30){g.crosshair.x=W-30;g.crosshair.dir=-1;}
      if(g.crosshair.x<30){g.crosshair.x=30;g.crosshair.dir=1;}
      if(g.power.state==="moving"){g.power.value+=g.power.dir*g.power.speed*dt;if(g.power.value>=100){g.power.value=100;g.power.dir=-1;}if(g.power.value<=0){g.power.value=0;g.power.dir=1;}}else g.power.value=g.power.lockedValue;
      for(let i=g.bullets.length-1;i>=0;i--){const b=g.bullets[i];b.trail.push({x:b.x,y:b.y});if(b.trail.length>8)b.trail.shift();b.x+=b.vx*dt;b.y+=b.vy*dt;
        if(Math.abs(b.y-g.ship.y)<28&&Math.abs(b.x-g.ship.x)<g.ship.w*0.5){const dmg=50+upgrades.damage.main;g.ship.hp-=dmg;g.ship.hitFlash=1;for(let k=0;k<18;k++){const ang=Math.random()*Math.PI*2,sp=Math.random()*180+40;g.particles.push({x:g.ship.x,y:g.ship.y,vx:Math.cos(ang)*sp+g.ship.dir*20,vy:Math.sin(ang)*sp,life:1,size:Math.random()*3+1.5,color:Math.random()>0.5?"#ffde59":"#ff8a4d"});}g.bullets.splice(i,1);g.power.state="moving";
          if(g.ship.hp<=0){const earn=20+g.level*5;setTempCoins(earn);g.points+=100*g.level;setLevelUpInfo({level:g.level+1,points:g.points});for(let k=0;k<42;k++){const ang=Math.random()*Math.PI*2,sp=Math.random()*320+40;g.particles.push({x:g.ship.x,y:g.ship.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1,size:Math.random()*5+2,color:`hsl(${40+Math.random()*30},100%,${60+Math.random()*20}%)`});}setView('levelup');setTimeout(()=>{if(gameRef.current.level===g.level){const nc=coins+earn;setCoins(nc);localStorage.setItem('wasa_coins_final',nc);g.level+=1;g.misses=0;g.bullets=[];g.power.state="moving";g.power.value=20;g.power.dir=1;initShip(g.level,W,H);setView('playing');}},4000);}
          continue;}
        if(b.y<-30||b.x<-30||b.x>W+30){g.bullets.splice(i,1);g.misses+=1;g.power.state="moving";if(g.misses>=5)setView('gameover');}
      }
    }
    for(let i=g.particles.length-1;i>=0;i--){const p=g.particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.98;p.vy+=80*dt;p.life-=dt*0.9;if(p.life<=0)g.particles.splice(i,1);}
    const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,"#21418f");grad.addColorStop(1,"#5e80e1");ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
    for(const s of g.stars){const a=0.5+Math.sin(now*0.001*s.twinkle+s.offset)*0.5;ctx.fillStyle=`rgba(255,255,255,${0.3+a*0.7})`;ctx.beginPath();ctx.arc(s.x,s.y,s.size*(0.7+a*0.6),0,Math.PI*2);ctx.fill();}
    drawShip(ctx,g.ship);
    if(view==='playing'||view==='levelup'){
      if(g.ship.hp>0){const pct=Math.max(0,g.ship.hp/g.ship.maxHp);ctx.fillStyle="rgba(0,0,0,0.5)";ctx.fillRect(g.ship.x-24,g.ship.y-22,48,4);ctx.fillStyle=pct>0.5?"#4ade80":pct>0.25?"#facc15":"#ef4444";ctx.fillRect(g.ship.x-24,g.ship.y-22,48*pct,4);}
      for(const b of g.bullets){for(let j=0;j<b.trail.length;j++){const t=b.trail[j],a=j/b.trail.length;ctx.fillStyle=`rgba(255,222,89,${a*0.6})`;ctx.beginPath();ctx.arc(t.x,t.y,2+a*2,0,Math.PI*2);ctx.fill();}ctx.shadowColor="#ffde59";ctx.shadowBlur=16;ctx.fillStyle="#fffe8a";ctx.beginPath();ctx.arc(b.x,b.y,5.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
      for(const p of g.particles){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;}
      if(view==='playing'){drawCross(ctx,g.crosshair.x,g.crosshair.y,now,g.power.state==="locked");}
      const cx=W/2,cy=H-56;ctx.save();ctx.translate(cx,cy);ctx.fillStyle="#1a2a5a";ctx.beginPath();ctx.ellipse(0,0,26,10,0,0,Math.PI*2);ctx.fill();if(view==='playing'){const ang=Math.atan2(g.crosshair.y-cy,g.crosshair.x-cx);ctx.rotate(ang);ctx.fillStyle="#e6e8ff";ctx.fillRect(0,-5,36,10);ctx.fillStyle="#ffde59";ctx.fillRect(32,-3,10,6);}ctx.restore();
    }
    if(now%100<16){setHud(s=>({...s,level:g.level,points:g.points,misses:g.misses,power:g.power.value,powerLocked:g.power.state==="locked",powerLockedVal:g.power.lockedValue,shipHp:Math.max(0,g.ship.hp),shipMax:g.ship.maxHp}));}
  };last=performance.now();anim=requestAnimationFrame(loop);return()=>{cancelAnimationFrame(anim);window.removeEventListener('resize',resize);};},[view,coins,upgrades,initStars,initShip]);

  const buySub=(type)=>{const up=JSON.parse(JSON.stringify(upgrades));const cur=up[type];if(cur.main>=50)return;const cost=cur.main+1;if(coins<cost)return;const newCoins=coins-cost;setCoins(newCoins);localStorage.setItem('wasa_coins_final',newCoins);cur.sub+=1;if(cur.sub>=5){cur.main+=1;cur.sub=0;}up[type]=cur;setUpgrades(up);localStorage.setItem('wasa_upgrades_final',JSON.stringify(up));};

  return (
    <div className="relative w-full h- bg-[#21418f] overflow-hidden">
      <canvas ref={canvasRef} className="absolute inset-0 w-full h-full" onPointerDown={e=>{if(e.target.closest('button'))return;if(view==='playing')handleInput();}} />
      <div className="absolute top-0 left-0 right-0 p-3 flex justify-between z-10 pointer-events-none">
        <div className="flex gap-2 pointer-events-auto"><div className="bg-black/35 px-3.5 py-1.5 rounded-full text-white text- font-black border border-white/10">NIVEL {hud.level}</div><div className="bg-black/35 px-3.5 py-1.5 rounded-full text-white text- font-black border border-white/10">{hud.points} PTS</div><div className="bg-[#ffde59] text-black px-3 py-1.5 rounded-full text- font-black border-2 border-black">💰 {coins}</div></div>
        <div className="flex flex-col items-end gap-2 pointer-events-auto"><div className="flex gap-1.5 bg-black/30 px-3 py-1.5 rounded-full border border-white/10">{Array.from({length:5}).map((_,i)=>{const ok=i<5-hud.misses;return <div key={i} className={`w-2.5 h-2.5 rounded-full ${ok?'bg-[#ffde59]':'bg-white/15'}`}></div>})}</div></div>
      </div>
      {view==='playing' && <>
        <div className="absolute bottom-0 left-0 p-3 z-10"><div className="text- font-black text-white/80">POTENCIA {hud.powerLocked?`${Math.round(hud.powerLockedVal)}%`:Math.round(hud.power)+'%'}</div><div className={`w- h- rounded- border p-1.5 flex flex-col justify-end ${hud.powerLocked?'bg-[#ffde59]/15 border-[#ffde59]/60':'bg-black/45 border-white/15'}`}><div className="w-full rounded-" style={{height:`${hud.powerLocked?hud.powerLockedVal:hud.power}%`,background:'#ffde59'}}></div></div></div>
        <div className="absolute bottom-0 right-0 p-3 z-10"><button onPointerDown={e=>{e.preventDefault();handleInput();}} className={`font-black px-9 py-4 rounded-full border-2 border-black ${flash?'scale-95':''} ${hud.powerLocked?'bg-[#ffde59] text-black':'bg-white/15 text-white/60'}`}>{hud.powerLocked?'DISPARAR':'FIJAR'}</button></div>
      </>}
      {view==='menu' && <div className="absolute inset-0 z-20 flex items-center justify-center p-4 bg-[#21418f]/55 backdrop-blur-"><div className="w-full max-w- rounded- bg-[#0f1b3e]/90 border border-white/15 p-7"><h1 className="text-white font-black text- leading-[0.9]">CAZA LA<br/><span className="text-[#ffde59]">NAVE</span></h1><p className="text-white/60 text- mt-3">Original + 50 niveles x 5 subniveles = 250. Duplicar solo al ganar.</p><div className="mt-6 flex flex-col gap-3"><button onClick={startGame} className="w-full bg-[#ffde59] text-black font-black py-4 rounded-full border-2 border-black">JUGAR</button><button onClick={()=>setView('shop')} className="w-full bg-white/10 text-white font-black py-3.5 rounded-full border border-white/15">MEJORAS • {upgrades.damage.main+upgrades.crosshair.main+upgrades.power.main}/150</button><button onClick={()=>setView('ranking')} className="w-full bg-white/10 text-white font-black py-3.5 rounded-full border border-white/15">RANKING</button></div></div></div>}
      {view==='shop' && <div className="absolute inset-0 z-20 flex justify-center p-3 bg-[#0a1430]/80 backdrop-blur overflow-y-auto"><div className="w-full max-w- bg-[#0f1b3e]/95 border border-white/15 rounded- p-6 my-6"><div className="flex justify-between"><h2 className="text-white font-black">MEJORAS 50 NIVELES</h2><button onClick={()=>setView('menu')} className="w-8 h-8 bg-white/10 text-white rounded-full">✕</button></div><div className="text-[#ffde59] mt-2 font-black">💰 {coins}</div><div className="text-white/50 text- mt-1">5 sub x nivel. Costo = nivel. Nivel1:5 monedas, Nivel50:250 monedas. Total 6375 por mejora.</div>{[{id:'damage',name:'DAÑO BALA'},{id:'crosshair',name:'MIRA LENTA'},{id:'power',name:'POTENCIA LENTA'}].map(u=>{const cur=upgrades[u.id];const cost=cur.main+1;return <div key={u.id} className="mt-4 bg-white/5 border border-white/10 rounded-2xl p-4"><div className="flex justify-between"><div className="text-white font-black text-">{u.name} <span className="text-[#ffde59]">{cur.main}/50</span></div><div className="text- text-white/40">{cost} 💰</div></div><div className="mt-2 flex gap-1.5">{Array.from({length:5}).map((_,i)=><div key={i} className={`flex-1 h-2 rounded-full ${i<cur.sub?'bg-[#ffde59]':'bg-white/10'}`}></div>)}</div><div className="mt-2 flex justify-between"><span className="text- text-white/50">{cur.sub}/5 → nivel {cur.main+1}</span><button disabled={coins<cost||cur.main>=50} onClick={()=>buySub(u.id)} className={`px-4 py-2 rounded-full text- font-black border-2 border-black ${coins>=cost&&cur.main<50?'bg-[#ffde59] text-black':'bg-white/10 text-white/30'}`}>COMPRAR</button></div><div className="mt-2 grid grid-cols-10 gap-1">{Array.from({length:50}).map((_,i)=><div key={i} className={`h-3 rounded-sm ${i<cur.main?'bg-[#ffde59]':'bg-white/10'}`}></div>)}</div></div>})}</div></div>}
      {view==='ranking' && <div className="absolute inset-0 z-20 flex items-center justify-center p-4 bg-black/60 backdrop-blur"><div className="w-full max-w- bg-[#0f1b3e]/95 border border-white/15 rounded- p-6"><h2 className="text-white font-black">RANKING - luego D1</h2><button onClick={()=>setView('menu')} className="float-right w-8 h-8 bg-white/10 text-white rounded-full">✕</button><div className="mt-4 text-white/30 text- text-center py-8">Ranking local por ahora. Luego conectamos a game-api.wasa.chat + D1</div></div></div>}
      {view==='levelup' && <div className="absolute inset-0 z-20 flex items-center justify-center"><div className="bg-black/60 backdrop-blur-xl border border-white/15 rounded- px-8 py-6 text-center"><div className="text-[#ffde59] font-black text-">¡NAVE DESTRUIDA!</div><div className="text-white font-black text- mt-1">NIVEL {levelUpInfo.level-1} → {levelUpInfo.level}</div><div className="mt-3 bg-white/10 rounded-full px-4 py-2 text- text-white">Monedas: <span className="text-[#ffde59] font-black">{tempCoins}</span></div><button onClick={()=>openAd('double')} className="mt-4 w-full bg-[#ffde59] text-black font-black py-3 rounded-full border-2 border-black">🎬 DUPLICAR x2 (SOLO AL GANAR)</button></div></div>}
      {view==='gameover' && <div className="absolute inset-0 z-20 flex items-center justify-center p-4 bg-[#0a1430]/70 backdrop-blur"><div className="w-full max-w- bg-[#0f1b3e]/95 border border-white/15 rounded- p-7 text-center"><div className="text-red-300 font-black text-">GAME OVER</div><h2 className="text-white font-black text- mt-1">Puntaje {hud.points}</h2><div className="mt-4 flex flex-col gap-3"><button disabled={adUses>=3} onClick={()=>openAd('lives')} className={`w-full font-black py-4 rounded-full border-2 border-black ${adUses>=3?'bg-white/10 text-white/30':'bg-[#ffde59] text-black'}`}>+3 TIROS ({adUses}/3)</button><button onClick={startGame} className="w-full bg-white/10 text-white py-3 rounded-full border border-white/15">REINICIAR</button><button onClick={()=>setView('menu')} className="w-full text-white/60 py-2 text-">MENU</button></div></div></div>}
      {showAd && <div className="absolute inset-0 z-[60] bg-black flex flex-col"><div className="h-12 flex justify-between items-center px-4 bg-[#111] border-b border-white/10"><span className="text-white text-">{showAd==='lives'?'+3 tiros':'x2 monedas'}</span><button disabled={!adUnlocked} onClick={()=>adUnlocked&&setShowAd(null)} className={`w-8 h-8 rounded-full ${adUnlocked?'bg-white text-black':'bg-white/10 text-white/20'}`}>{adUnlocked?'✕':adTimer}</button></div><div className="flex-1 flex items-center justify-center p-6"><div className="bg-[#222] rounded- p-6 text-center border border-white/10"><div className="w-16 h-16 mx-auto rounded-2xl bg-[#ffde59] flex items-center justify-center text-">🚀</div><div className="text-white font-black mt-4">Mock Ad - Aquí va AdInPlay/GameMonetize</div><div className="mt-2 text-white/50 text-">{adUnlocked?'✓ Desbloqueado':`Espera ${adTimer}s`}</div></div></div><div className="p-4 bg-[#111] border-t border-white/10"><button disabled={!adUnlocked} onClick={claimAd} className={`w-full py-3.5 rounded-full font-black border-2 border-black ${adUnlocked?'bg-[#ffde59] text-black':'bg-white/10 text-white/20'}`}>{adUnlocked?'RECLAMAR':'ESPERA'}</button></div></div>}
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
<!-- PEGA TU TAG DE GAMEMONETIZE / ADINPLAY AQUI -->
</body>
</html>
