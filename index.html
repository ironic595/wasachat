<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>wasa.chat - founders</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;overflow-x:hidden}
body{
  background: radial-gradient(ellipse at 50% 0%, rgba(79, 70, 229, 0.15) 0%, transparent 70%),
              radial-gradient(ellipse at 100% 80%, rgba(245, 158, 11, 0.10) 0%, transparent 60%),
              linear-gradient(180deg, #21418f 0%, #332891 40%, #5e80e1 100%);
  overflow:hidden
}
#hero{position:relative;width:100vw;height:100vh;overflow:hidden}
#starCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#logo-wrap{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:10;display:flex;align-items:baseline;justify-content:center;
  gap:clamp(2px,0.8vw,8px);width:92vw;max-width:900px;
  flex-wrap:nowrap;
}
.letter{
  height:clamp(32px,9vw,100px);width:auto;
  object-fit:contain;display:block;
  flex-shrink:1;min-width:0;
  filter:brightness(0) invert(1);
  transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1), filter 0.3s;
  will-change: transform;
}
.letter.dot{
  height:clamp(6px,1.8vw,100px)!important;
  width:clamp(6px,1.8vw,100px)!important;
  margin-bottom:clamp(14px,4.5vw,10px)!important;
  margin-left:0px;margin-right:0px
}
#subtitle{
  position:absolute;top:100%;left:50%;transform:translateX(-50%);
  margin-top:12px;white-space:nowrap;color:rgba(255,255,255,0.8);
  font-size:clamp(6px,1.5vw,11px);letter-spacing:clamp(1px,0.4vw,4px)
}
@media (max-width:480px){
  #logo-wrap{width:90vw;gap:1px}
 .letter{height:8.5vw}
 .letter.dot{height:2.2vw!important;width:2.2vw!important;margin-bottom:3.2vw!important}
  #subtitle{font-size:2.6vw;letter-spacing:0.8vw;margin-top:8px}
}
#cta-wrap{position:absolute;bottom:clamp(24px,6vh,48px);left:50%;transform:translateX(-50%);z-index:20;width:90vw;display:flex;justify-content:center}
#cta{background:linear-gradient(180deg,#FFD60A 0%,#FFB000 100%);color:#000;font-weight:800;font-size:clamp(12px,3vw,15px);padding:18px 36px;border-radius:14px;border:1px solid rgba(255,255,255,0.4);box-shadow:0 8px 24px rgba(0,0,0,0.3);cursor:pointer;animation:pulseSuave 2.5s ease-in-out infinite;white-space:nowrap}
@keyframes pulseSuave{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
</style>
</head>
<body>
<div id="hero">
  <canvas id="starCanvas"></canvas>
  <div id="logo-wrap">
    <img src="/assets/img/w.png" class="letter" data-original="0" alt="w">
    <img src="/assets/img/a.png" class="letter" data-original="1" alt="a">
    <img src="/assets/img/s.png" class="letter" data-original="2" alt="s">
    <img src="/assets/img/a2.png" class="letter" data-original="3" alt="a">
    <img src="/assets/img/punto.png" class="letter dot" data-original="4" alt=".">
    <img src="/assets/img/c.png" class="letter" data-original="5" alt="c">
    <img src="/assets/img/h.png" class="letter" data-original="6" alt="h">
    <img src="/assets/img/a3.png" class="letter" data-original="7" alt="a">
    <img src="/assets/img/t.png" class="letter" data-original="8" alt="t">
    <div id="subtitle">WASA.CHAT — DIC 15 2026 — FOUNDERS</div>
  </div>
  <div id="cta-wrap"><button id="cta">COMPRAR FOUNDER PASS 20% OFF</button></div>
</div>

<script>
// FONDO ESTRELLAS
const c=document.getElementById('starCanvas'),ctx=c.getContext('2d');let stars=[];
function init(){c.width=innerWidth;c.height=innerHeight;stars=[];for(let i=0;i<250;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.3+0.2,speed:Math.random()*0.4+0.1,a:Math.random()*0.6+0.3})}
function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.y-=s.speed;if(s.y<-5){s.y=c.height+5;s.x=Math.random()*c.width}ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${s.a})`;ctx.fill()});requestAnimationFrame(draw)}
init();draw();addEventListener('resize',init);

// EFECTO CAMBIO DE ORDEN AL AZAR
const wrap=document.getElementById('logo-wrap');
const letters=Array.from(wrap.querySelectorAll('.letter'));
let isAnimating=false;
let returnTimeout=null;

function shuffleLetters(){
  if(isAnimating) return;
  isAnimating=true;

  const dot = wrap.querySelector('.dot');
  const allLetters = Array.from(wrap.querySelectorAll('.letter'));
  const otherLetters = allLetters.filter(el => !el.classList.contains('dot'));

  // 1. Guardar posiciones actuales
  const firstPos = new Map();
  allLetters.forEach(el => firstPos.set(el, el.getBoundingClientRect()));

  // 2. Mezclar solo las letras, NO el punto
  const shuffledOthers = [...otherLetters].sort(()=>Math.random()-0.5);
  
  // 3. Reconstruir: 4 letras + punto + 4 letras
  const newOrder = [
    ...shuffledOthers.slice(0,4),
    dot,
    ...shuffledOthers.slice(4)
  ];
  
  newOrder.forEach(el => wrap.appendChild(el));

  // 4. Animar FLIP
  const lastPos = new Map();
  newOrder.forEach(el => lastPos.set(el, el.getBoundingClientRect()));

  newOrder.forEach(el=>{
    const first = firstPos.get(el);
    const last = lastPos.get(el);
    const dx = first.left - last.left;
    const dy = first.top - last.top;
    el.style.transition='none';
    el.style.transform=`translate(${dx}px, ${dy}px)`;
  });

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      newOrder.forEach(el=>{
        el.style.transition='transform 0.7s cubic-bezier(0.34,1.56,0.64,1)';
        el.style.transform='translate(0,0)';
      });
    });
  });

  // 5. Volver al orden original
  clearTimeout(returnTimeout);
  returnTimeout=setTimeout(()=>{
    const firstReturn = new Map();
    newOrder.forEach(el=>firstReturn.set(el, el.getBoundingClientRect()));

    const ordered = [...allLetters].sort((a,b)=>a.dataset.original - b.dataset.original);
    ordered.forEach(el=>wrap.appendChild(el));

    const lastReturn = new Map();
    ordered.forEach(el=>lastReturn.set(el, el.getBoundingClientRect()));

    ordered.forEach(el=>{
      const first = firstReturn.get(el);
      const last = lastReturn.get(el);
      const dx = first.left - last.left;
      const dy = first.top - last.top;
      el.style.transition='none';
      el.style.transform=`translate(${dx}px, ${dy}px)`;
    });
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        ordered.forEach(el=>{
          el.style.transition='transform 0.6s cubic-bezier(0.34,1.56,0.64,1)';
          el.style.transform='translate(0,0)';
        });
        setTimeout(()=>{isAnimating=false;},700);
      });
    });
  },1300);
}
wrap.addEventListener('mouseenter', shuffleLetters);
wrap.addEventListener('mousemove', (e)=>{
  // solo dispara si te moves mucho, para no spamear
  if(!wrap._lastShuffle || Date.now() - wrap._lastShuffle > 2000){
    const rect=wrap.getBoundingClientRect();
    if(Math.hypot(e.clientX-(rect.left+rect.width/2), e.clientY-(rect.top+rect.height/2))<200){
      wrap._lastShuffle=Date.now();
      shuffleLetters();
    }
  }
});

document.getElementById('cta').onclick=()=>{window.location.href='https://founders.wasa.chat'};
</script>
</body>
</html>
