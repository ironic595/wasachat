<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wasa.chat - founders</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:Inter,system-ui;overscroll-behavior:none}
#hero{position:relative;width:100vw;height:100vh;isolation:isolate}
#bg-future{position:absolute;inset:0;background:url('ciudad-futuro.png') center/cover no-repeat}
#eraseCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none}

/* LOGO RESPONSIVE */
#logo-wrap{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  z-index:10;
  display:flex;
  align-items:baseline;
  justify-content:center;
  gap: clamp(3px, 1vw, 10px);
  width: 92vw;
  max-width: 900px;
  perspective:1000px;
  mix-blend-mode:difference;
}
.letter{
  height: clamp(36px, 11vw, 100px);
  width: auto;
  object-fit: contain;
  display:block;
  will-change:transform;
  transform-style:preserve-3d;
  transition:transform 0.8s cubic-bezier(0.68,-0.6,0.32,1.6);
  flex-shrink:1;
  min-width:0;
}
/* PUNTO CORREGIDO - mismo peso visual */
#logo-wrap.letter.dot{
  height: clamp(8px, 2.2vw, 20px);
  width: clamp(8px, 2.2vw, 20px);
  margin-bottom: clamp(18px, 5.5vw, 42px);
  margin-left: 2px;
  margin-right: 2px;
}
#subtitle{
  position:absolute;
  top:100%; left:50%;
  transform:translateX(-50%);
  margin-top: clamp(12px, 2.5vw, 24px);
  white-space:nowrap;
  color:white;
  font-size: clamp(7px, 1.6vw, 11px);
  letter-spacing: clamp(2px, 0.5vw, 4px);
  opacity:0.8;
  text-align:center;
}
@media (max-width:480px){
  #logo-wrap{width:94vw; gap:3px}
 .letter{height:10.8vw}
  #logo-wrap.letter.dot{height:2.6vw;width:2.6vw;margin-bottom:4.2vw}
}
</style>
</head>
<body>
<div id="hero">
  <div id="bg-future"></div>
  <canvas id="eraseCanvas"></canvas>
  <div id="logo-wrap">
    <img src="/assets/img/w.png" class="letter" alt="w">
    <img src="/assets/img/a.png" class="letter" alt="a">
    <img src="/assets/img/s.png" class="letter" alt="s">
    <img src="/assets/img/a2.png" class="letter" alt="a">
    <img src="/assets/img/punto.png" class="letter dot" alt=".">
    <img src="/assets/img/c.png" class="letter" alt="c">
    <img src="/assets/img/h.png" class="letter" alt="h">
    <img src="/assets/img/a3.png" class="letter" alt="a">
    <img src="/assets/img/t.png" class="letter" alt="t">
    <div id="subtitle">WASA.CHAT — DIC 15 2026 — FOUNDERS</div>
  </div>
</div>

<script>
const darkImg=new Image();darkImg.src='ciudad-oscura.png';
const canvas=document.getElementById('eraseCanvas'),ctx=canvas.getContext('2d');
let w,h,lx=0,ly=0;
function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight;if(darkImg.complete)draw()}
function draw(){ctx.globalCompositeOperation='source-over';ctx.drawImage(darkImg,0,0,w,h)}
darkImg.onload=draw;addEventListener('resize',resize);resize();
function erase(x,y){
  ctx.globalCompositeOperation='destination-out';
  const g=ctx.createRadialGradient(x,y,0,x,y,75);
  g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,75,0,Math.PI*2);ctx.fill();
  if(lx){const dx=x-lx,dy=y-ly,d=Math.hypot(dx,dy),s=Math.ceil(d/10);for(let i=0;i<s;i++){ctx.beginPath();ctx.arc(lx+dx*i/s,ly+dy*i/s,75,0,Math.PI*2);ctx.fill()}}
  lx=x;ly=y;
}
canvas.addEventListener('mousemove',e=>{erase(e.clientX,e.clientY);scatter(e.clientX,e.clientY)});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];erase(t.clientX,t.clientY);scatter(t.clientX,t.clientY)},{passive:false});
canvas.addEventListener('mouseleave',()=>{lx=0});

const letters=document.querySelectorAll('.letter');
let tmr;
function scatter(mx,my){
  const r=document.getElementById('logo-wrap').getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  if(Math.hypot(mx-cx,my-cy)>380)return;
  const intensity=1-Math.hypot(mx-cx,my-cy)/380;
  letters.forEach(el=>{
    if(el._busy)return;
    el.style.transform=`translate3d(${(Math.random()-0.5)*260*intensity}px,${(Math.random()-0.5)*180*intensity}px,80px) rotate(${(Math.random()-0.5)*540*intensity}deg) rotateX(${(Math.random()-0.5)*180}deg) rotateY(${(Math.random()-0.5)*180}deg) scale(${0.6+Math.random()*0.8})`;
    el._busy=true;setTimeout(()=>el._busy=false,800);
  });
  clearTimeout(tmr);tmr=setTimeout(()=>letters.forEach((el,i)=>setTimeout(()=>el.style.transform='none',i*55)),750);
}
setInterval(()=>{if(Math.random()>0.6)scatter(innerWidth/2+(Math.random()-0.5)*100,innerHeight/2)},4000);
</script>
</body>
</html>
