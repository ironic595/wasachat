<!DOCTYPE html>
<html>
<head>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{ background:#000; overflow:hidden; font-family: sans-serif; }

  #hero{
    position:relative;
    width:100vw; height:100vh;
  }
 .bg{
    position:absolute; inset:0;
    background-size:cover;
    background-position:center;
  }
  /* PONE ACA TUS FOTOS */
  #bg-dark{
    background-image: url('ciudad-oscura.jpg');
  }
  #bg-future{
    background-image: url('ciudad-futuro.jpg');
    /* Esta es la que se revela con el mouse */
    clip-path: circle(180px at 50% 50%);
    transition: clip-path 0.05s linear;
  }

  /* LOGO EN EL MEDIO */
  #logo-wrap{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    z-index:20;
    pointer-events:none;
  }
  #logo-wasa{
    width: 340px;
    /* ESTO HACE LA MAGIA DEL CONTRASTE */
    mix-blend-mode: difference;
    filter: invert(1) brightness(1.2);
  }
  #subtitle{
    color:white;
    text-align:center;
    margin-top:16px;
    letter-spacing: 4px;
    font-size:11px;
    opacity:0.7;
    mix-blend-mode: difference;
  }
</style>
</head>
<body>

<div id="hero">
  <div class="bg" id="bg-dark"></div>
  <div class="bg" id="bg-future"></div>

  <div id="logo-wrap">
    <!-- PONE ACA TU LOGO -->
    <img id="logo-wasa" src="logo-wasa.png" alt="wasa.chat" />
    <div id="subtitle">WASA.CHAT — DIC 2026</div>
  </div>
</div>

<script>
  const future = document.getElementById('bg-future');
  const hero = document.getElementById('hero');

  function update(e){
    const x = e.clientX || e.touches?.[0]?.clientX;
    const y = e.clientY || e.touches?.[0]?.clientY;
    future.style.clipPath = circle(180px at ${x}px ${y}px);
  }

  hero.addEventListener('mousemove', update);
  hero.addEventListener('touchmove', update);

  // Cuando sale el mouse, se cierra
  hero.addEventListener('mouseleave', () => {
    future.style.clipPath = circle(0px at 50% 50%);
  });
</script>

</body>
</html>
