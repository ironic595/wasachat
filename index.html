<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>wasa.chat - founders</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;overflow-x:hidden}
body{
  background: radial-gradient(ellipse at 50% 0%, rgba(79, 70, 229, 0.15) 0%, transparent 70%),
              radial-gradient(ellipse at 100% 80%, rgba(245, 158, 11, 0.10) 0%, transparent 60%),
              linear-gradient(180deg, #21418f 0%, #332891 40%, #5e80e1 100%);
  overflow:hidden
}
#hero{position:relative;width:100vw;height:100vh;overflow:hidden}
#starCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block}
#logo-wrap{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:10;display:flex;align-items:baseline;justify-content:center;
  gap:clamp(2px,0.8vw,8px);width:92vw;max-width:900px;perspective:1000px;
  flex-wrap:nowrap;
}
.letter{
  height:clamp(32px,9vw,100px);width:auto;max-width:100%;
  object-fit:contain;display:block;will-change:transform;
  transform-style:preserve-3d;transition:transform 0.8s cubic-bezier(0.68,-0.6,0.32,1.6);
  flex-shrink:1;min-width:0;
  filter:brightness(0) invert(1)
}
.letter.dot{
  height:clamp(6px,1.8vw,18px)!important;
  width:clamp(6px,1.8vw,18px)!important;
  margin-bottom:clamp(14px,4.5vw,38px)!important;
  margin-left:1px;margin-right:1px
}
#subtitle{
  position:absolute;top:100%;left:50%;transform:translateX(-50%);
  margin-top:12px;white-space:nowrap;color:rgba(255,255,255,0.8);
  font-size:clamp(6px,1.5vw,11px);letter-spacing:clamp(1px,0.4vw,4px);text-align:center
}
@media (max-width:480px){
  #logo-wrap{width:90vw;gap:1px}
 .letter{height:8.5vw}
 .letter.dot{height:2.2vw!important;width:2.2vw!important;margin-bottom:3.2vw!important}
  #subtitle{font-size:2.6vw;letter-spacing:0.8vw;margin-top:8px}
}
  #cta{
  margin-top:32px;
  background: linear-gradient(180deg, #FFD60A 0%, #FFB000 100%);
  color:#000; 
  font-family: inherit;
  font-weight:800; 
  font-size:clamp(11px,2.8vw,14px);
  letter-spacing:0.5px; 
  padding:18px 36px;
  border-radius:14px; 
  border:1px solid rgba(255,255,255,0.4);
  box-shadow:0 8px 24px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.6);
  cursor:pointer;
  animation: titilar 2s ease-in-out infinite;
  transition: transform 0.2s;
  display:block;
}
#cta:hover{transform:scale(1.08)}
@keyframes titilar{
  0%,100%{transform:scale(1) rotate(-1deg); box-shadow:0 8px 24px rgba(0,0,0,0.3)}
  50%{transform:scale(1.05) rotate(1deg); box-shadow:0 12px 32px rgba(0,0,0,0.4), 0 0 20px rgba(255,214,10,0.5)}
}
</style>
</head>
<body>
<div id="hero">
  <canvas id="starCanvas"></canvas>
  <div id="logo-wrap">
    <img src="/assets/img/w.png" class="letter" alt="w">
    <img src="/assets/img/a.png" class="letter" alt="a">
    <img src="/assets/img/s.png" class="letter" alt="s">
    <img src="/assets/img/a2.png" class="letter" alt="a">
    <img src="/assets/img/punto.png" class="letter dot" alt=".">
    <img src="/assets/img/c.png" class="letter" alt="c">
    <img src="/assets/img/h.png" class="letter" alt="h">
    <img src="/assets/img/a3.png" class="letter" alt="a">
    <img src="/assets/img/t.png" class="letter" alt="t">
    <div id="subtitle">WASA.CHAT — DIC 15 2026 — FOUNDERS</div>
  </div>
  <button id="cta">COMPRAR FOUNDER PASS 20% OFF</button>
</div>

<script>
const starCanvas=document.getElementById('starCanvas'), sCtx=starCanvas.getContext('2d');
let stars=[];
function initStars(){
  starCanvas.width=innerWidth; starCanvas.height=innerHeight;
  stars=[];
  for(let i=0;i<250;i++){
    stars.push({x:Math.random()*starCanvas.width,y:Math.random()*starCanvas.height,r:Math.random()*1.3+0.2,speed:Math.random()*0.4+0.1,alpha:Math.random()*0.6+0.3,twinkle:Math.random()*0.04});
  }
}
function drawStars(){
  sCtx.clearRect(0,0,starCanvas.width,starCanvas.height);
  stars.forEach(s=>{
    s.y-=s.speed; s.alpha+=(Math.random()-0.5)*s.twinkle; s.alpha=Math.max(0.2,Math.min(1,s.alpha));
    if(s.y<-5){s.y=starCanvas.height+5; s.x=Math.random()*starCanvas.width;}
    sCtx.beginPath(); sCtx.arc(s.x,s.y,s.r,0,Math.PI*2); sCtx.fillStyle=`rgba(255,255,255,${s.alpha})`; sCtx.fill();
  });
  requestAnimationFrame(drawStars);
}
initStars(); drawStars(); addEventListener('resize', initStars);

const letters=document.querySelectorAll('.letter'); let tmr;
function scatter(mx,my){
  const r=document.getElementById('logo-wrap').getBoundingClientRect();
  if(Math.hypot(mx-(r.left+r.width/2),my-(r.top+r.height/2))>400)return;
  letters.forEach(el=>{
    if(el._busy)return;
    el.style.transform=`translate3d(${(Math.random()-0.5)*220}px,${(Math.random()-0.5)*140}px,60px) rotate(${(Math.random()-0.5)*400}deg) scale(${0.7+Math.random()*0.5})`;
    el._busy=true; setTimeout(()=>el._busy=false,900);
  });
  clearTimeout(tmr); tmr=setTimeout(()=>letters.forEach((el,i)=>setTimeout(()=>el.style.transform='none',i*50)),700);
}
document.addEventListener('mousemove', e=>scatter(e.clientX,e.clientY));
document.addEventListener('touchmove', e=>{const t=e.touches[0];scatter(t.clientX,t.clientY)},{passive:false});

  document.getElementById('cta').onclick=()=>{window.location.href='https://founders.wasa.chat'};
</script>
</body>
</html>
