<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout Cripto - wasa.chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>*{font-family:"Instrument Sans",system-ui,sans-serif}.display{font-family:"Syne",sans-serif}</style>
</head>
<body class="bg-[#eef7ff] min-h-screen">
<div class="bg-[#0a1a3a] text-white"><div class="max-w-[1100px] mx-auto px-6 py-4 flex justify-between"><a href="index-nuevo.html" class="h-8 px-3.5 flex items-center rounded-lg border border-white/20 bg-white/10 text-[12px] font-bold">wasa.chat</a><a href="index-nuevo.html" class="h-8 px-4 rounded-full bg-white/10 border border-white/20 text-[12px] font-semibold flex items-center">Volver</a></div></div>
<div class="max-w-[1100px] mx-auto px-6 py-10 grid grid-cols-1 lg:grid-cols-2 gap-8">
<div><div class="inline-flex px-3 py-1 rounded-full bg-[#0a1a3a] text-white text-[10px] font-bold">CHECKOUT CRIPTO - SOLO USDT</div><h1 class="display mt-4 text-[36px] font-extrabold">Finaliza tu pago</h1><p class="mt-3 text-[14px] text-zinc-500">Todo desconectado (mock) por ahora.</p><div class="mt-8 rounded-[20px] bg-white border p-6"><h3 class="font-bold text-[12px] text-zinc-400">PLAN</h3><div class="mt-4 flex gap-2"><button onclick="setPlan('basico')" id="btn-basico" class="plan-btn flex-1 h-11 rounded-full border-2 border-[#0a1a3a] bg-[#0a1a3a] text-white font-bold text-[12px]">Basico $150</button><button onclick="setPlan('intermedio')" id="btn-intermedio" class="plan-btn flex-1 h-11 rounded-full border bg-white font-bold text-[12px]">Inter $180</button><button onclick="setPlan('pro')" id="btn-pro" class="plan-btn flex-1 h-11 rounded-full border bg-white font-bold text-[12px]">Pro $600</button></div></div></div>
<div class="rounded-[24px] bg-white border p-6"><label class="block text-[11px] font-bold text-zinc-400 mb-2">RED USDT</label><div class="grid grid-cols-2 gap-2"><button onclick="setNet('trc20')" id="net-trc20" class="net-btn h-11 rounded-full bg-[#0a1a3a] text-white text-[11px] font-bold">TRC20 barato</button><button onclick="setNet('bep20')" id="net-bep20" class="net-btn h-11 rounded-full bg-white border text-[11px] font-bold">BEP20</button><button onclick="setNet('erc20')" id="net-erc20" class="net-btn h-11 rounded-full bg-white border text-[11px] font-bold">ERC20</button><button onclick="setNet('arbitrum')" id="net-arbitrum" class="net-btn h-11 rounded-full bg-white border text-[11px] font-bold">Arbitrum</button></div><div class="mt-6 rounded-[16px] bg-[#eef7ff] border p-4"><p class="text-[11px] font-bold" id="chain-label">TRC20 (Tron)</p><p id="chain-addr" class="mt-2 font-mono text-[11px] break-all bg-white border rounded p-2">TQr4aBcDeFgHiJkLmNoPqRsTuVwXyZ123456789</p><button onclick="navigator.clipboard.writeText(document.getElementById('chain-addr').innerText)" class="mt-2 h-8 px-3 rounded-full bg-white border text-[11px] font-bold">Copiar</button><p class="mt-2 text-[11px]">Monto: <span id="amount" class="font-bold">$150 USDT</span></p></div><div class="mt-6"><button id="btn-connect" onclick="connectW()" class="w-full h-12 rounded-full bg-[#0a1a3a] text-white font-bold text-[13px]">Conectar Billetera</button><div id="wallet-ok" class="hidden mt-3 bg-emerald-50 border border-emerald-200 p-3 rounded-[12px] flex justify-between"><span class="text-[11px] font-bold">0x1234...ABCD conectada</span><button onclick="payW()" class="h-8 px-4 rounded-full bg-emerald-600 text-white text-[11px] font-bold">Pagar</button></div><div id="wallet-pay" class="hidden mt-3 bg-blue-50 border p-3 rounded-[12px] text-[11px]">Enviando... Hash: 0xa1b2... Verificando...</div></div><div class="mt-6"><input id="tx-hash" placeholder="Pegar Tx Hash" class="w-full h-11 px-4 rounded-full border bg-zinc-50 text-[11px] font-mono"><button onclick="verify()" class="mt-2 w-full h-11 rounded-full border-2 border-[#0a1a3a] text-[#0a1a3a] font-bold text-[12px]">Verificar hash y activar</button><div id="verify-res" class="hidden mt-3 p-3 rounded-[12px] text-[11px]"></div></div></div>
</div>
<script>
let plan='basico', net='trc20';
const addrs={trc20:"TQr4aBcDeFgHiJkLmNoPqRsTuVwXyZ123456789 - TRC20", bep20:"0x1234...ABCD - BEP20", erc20:"0x5678...EFGH - ERC20", arbitrum:"0x9abc...IJKL - Arbitrum"};
const amts={basico:"$150 USDT", intermedio:"$180 USDT", pro:"$600 USDT"};
function setPlan(p){plan=p; document.querySelectorAll('.plan-btn').forEach(b=>b.className='plan-btn flex-1 h-11 rounded-full border bg-white font-bold text-[12px]'); document.getElementById('btn-'+p).className='plan-btn flex-1 h-11 rounded-full border-2 border-[#0a1a3a] bg-[#0a1a3a] text-white font-bold text-[12px]'; document.getElementById('amount').innerText=amts[p];}
function setNet(n){net=n; document.querySelectorAll('.net-btn').forEach(b=>b.className='net-btn h-11 rounded-full bg-white border text-[11px] font-bold'); document.getElementById('net-'+n).className='net-btn h-11 rounded-full bg-[#0a1a3a] text-white text-[11px] font-bold'; document.getElementById('chain-label').innerText=n.toUpperCase(); document.getElementById('chain-addr').innerText=addrs[n];}
function connectW(){document.getElementById('btn-connect').innerText='Conectando...'; setTimeout(()=>{document.getElementById('btn-connect').classList.add('hidden'); document.getElementById('wallet-ok').classList.remove('hidden');},700);}
function payW(){document.getElementById('wallet-ok').classList.add('hidden'); document.getElementById('wallet-pay').classList.remove('hidden'); setTimeout(()=>{document.getElementById('wallet-pay').innerHTML='✅ Verificado en '+net+'<br><a href="dashboard.html" class="underline font-bold">Ir al Dashboard</a>';},1500);}
function verify(){const h=document.getElementById('tx-hash').value; const r=document.getElementById('verify-res'); r.classList.remove('hidden'); r.className='mt-3 p-3 rounded-[12px] text-[11px] bg-blue-50 border'; r.innerText='Verificando '+h.slice(0,15)+'...'; setTimeout(()=>{r.className='mt-3 p-3 rounded-[12px] text-[11px] bg-emerald-50 border border-emerald-200'; r.innerHTML='✅ Hash valido - Cuenta activada<br><a href="dashboard.html" class="inline-flex mt-2 h-8 px-4 rounded-full bg-emerald-600 text-white font-bold items-center">Dashboard</a>';},1200);}
</script>
</body>
</html>
